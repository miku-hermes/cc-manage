name: docker-publish

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: node --test test/*.test.mjs

      # 内核自带测试（vendor/commandcode-proxy/test/）之前从没在 CI 跑过，
      # 但部署的正是这个内核镜像。它会 spawn 子进程 + 占端口，单独一步便于定位。
      - name: Run vendor core tests
        run: npm --prefix vendor/commandcode-proxy test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            context: .
            dockerfile: ./Dockerfile
          - image: core
            context: ./vendor/commandcode-proxy
            dockerfile: ./vendor/commandcode-proxy/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Prepare image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${OWNER}/cc-manage-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # 可变 tag 的 node:22-alpine 在构建前解析成 digest，锁住实际用的基础镜像。
      - name: Resolve base image digest
        id: base
        run: |
          DIGEST=$(docker buildx imagetools inspect node:22-alpine --format '{{json .Manifest.Digest}}' | tr -d '"')
          test -n "$DIGEST"
          echo "image=node:22-alpine@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
            REVISION=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
