name: docker-publish

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# B18-6：同一 workflow + ref 上同时只保留最新一次运行（PR 连推时立刻取消旧 run，省跑量）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # B18-6：actions 一律按 commit SHA 固定（tag 可被移动 = 供应链风险），注释里保留版本号。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Lint
        run: npm run lint

      # B22：根 public/ 是 Astro 构建产物、不进 git。干净 runner 上必须先构建面板，
      # 否则 gateway 的 GET / 找不到 public/index.html（测试与真实启动都会受影响）。
      # 构建会 `npm ci`（panel/package-lock.json 已提交，可复现）→ `npm run build` → 同步到 public/。
      - name: Build panel (panel/dist → root public/)
        run: bash scripts/panel-build.sh

      # CI 开测试并发加速（端口动态分配，并行安全）。
      # B20-2（skip 白名单守护）在本地默认跳过以保套件快，这里显式打开，保证 CI 必然跑它。
      - name: Run tests
        env:
          B20_SCAN: '1'
        run: node --test --test-concurrency=8 test/*.test.mjs

      # 内核自带测试（vendor/commandcode-proxy/test/）之前从没在 CI 跑过，
      # 但部署的正是这个内核镜像。它会 spawn 子进程 + 占端口，单独一步便于定位。
      - name: Run vendor core tests
        run: npm --prefix vendor/commandcode-proxy test

      # B18-5：shell 语法检查。run-from-ghcr.sh 的「等待就绪」失败路径以前从没被执行过，
      # 语法错误只有在真跑时才暴露；这里至少保证两把脚本能通过解析。
      - name: Shell syntax check
        run: bash -n scripts/run-from-ghcr.sh scripts/smoke.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    # B18-6：推 latest 的构建按 ref 串行（cancel-in-progress: false = 排队而不是取消）。
    # 同一 ref 上两次构建并行时，先开始的慢构建可能后推完，把 latest 指回旧提交；
    # 串行之后 latest 永远由最后一次构建写。
    concurrency:
      group: docker-publish-build-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            context: .
            dockerfile: ./Dockerfile
          - image: core
            context: ./vendor/commandcode-proxy
            dockerfile: ./vendor/commandcode-proxy/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${OWNER}/cc-manage-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: docker_meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # 可变 tag 的 node:22-alpine 在构建前解析成 digest，锁住实际用的基础镜像。
      - name: Resolve base image digest
        id: base
        run: |
          DIGEST=$(docker buildx imagetools inspect node:22-alpine --format '{{json .Manifest.Digest}}' | tr -d '"')
          test -n "$DIGEST"
          echo "image=node:22-alpine@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
            REVISION=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # B18-2：build 只 build 不 run —— CMD / EXPOSE / HEALTHCHECK / entrypoint / 运行时缺文件
  # 全都没有自动化验证（唯一相关的 test/deploy.test.mjs 是纯文本正则）。这个 job 真构建镜像、
  # 真起容器、等容器自己的 healthcheck 变 healthy，再跑 /health、/ready、面板骨架与一次
  # /v1 往返；不 push，所以 PR 上也能跑。
  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate compose config (base + override)
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml config -q

      - name: Container smoke (build + run + HTTP assertions)
        run: bash scripts/smoke.sh
