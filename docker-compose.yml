name: cc-manage

services:
  core:
    build: ./vendor/commandcode-proxy
    environment:
      PORT: "3050"
      HOST: "0.0.0.0"
      CC_MAX_BODY_MB: "${CC_MAX_BODY_MB:-20}"     # 2GB 小机器必须压小，见内核 README 内存章节
      CC_MAX_INFLIGHT: "${CC_MAX_INFLIGHT:-8}"
      NODE_OPTIONS: "--max-old-space-size=384"
    # 刻意不映射宿主端口：core 只允许网关容器访问
    mem_limit: 512m
    restart: unless-stopped
    # F24：vendor 的 Dockerfile 没有 USER，这里不改 vendor，改在编排层收紧权限。
    # 与 gateway 一致用 node 镜像自带的 uid/gid 1000。
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # core 无状态：不写 /app，只给 node 留一个可写的 /tmp
    read_only: true
    tmpfs:
      - /tmp
    # M5：core:3050 无鉴权（任何有效 CC key 都能无限用），因此不能与别的容器同网。
    #   core-net    —— internal: true，只有 gateway 挂得上（唯一入口）。
    #   core-egress —— 非 internal 且**只有 core 自己**挂：core 要直连 CC 上游
    #                  （vendor 内核自己 fetch CC_API_BASE），internal 网络没有出网路由。
    networks:
      core-net:
      core-egress:
    # F25：日志轮转，避免 json-file 无上限把宿主磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # B18：core 的探活仍是它自己的 /health —— vendor 内核（vendor/commandcode-proxy）
    # 只实现了 /health 与 /，没有 /ready（vendor 是上游镜像、本仓库不改）。
    # core 没有下游依赖，它的 readiness 就等于「内核在应答」；真正的「core 可达」由
    # gateway 侧的 /ready 负责（见下面 gateway 的 healthcheck）。
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3050/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 15s

  gateway:
    build: .
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_BIND_PORT:-3051}:3051"   # 只绑宿主回环，默认不对外
    environment:
      GATEWAY_HOST: "0.0.0.0"          # 容器内必须监听 0.0.0.0，宿主侧已限制为 127.0.0.1
      GATEWAY_PORT: "3051"
      UPSTREAM_PROXY_URL: "http://core:3050"
      CC_API_BASE: "${CC_API_BASE:-https://api.commandcode.ai}"
      PUBLIC_DASHBOARD: "${PUBLIC_DASHBOARD:-1}"       # 前台只读面板公开；设 0 则需登录后台
      QUOTA_POLL_INTERVAL_MS: "${QUOTA_POLL_INTERVAL_MS:-600000}"
      QUOTA_ACTIVE_POLL_INTERVAL_MS: "${QUOTA_ACTIVE_POLL_INTERVAL_MS:-60000}"
      QUOTA_ACTIVE_WINDOW_MS: "${QUOTA_ACTIVE_WINDOW_MS:-300000}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      NODE_OPTIONS: "--max-old-space-size=192"
    volumes:
      - ./config:/app/config                           # 凭据目录（可写）：后台账号/CC key/客户端 key
      - cc-manage-data:/app/data                       # 命名卷，避免宿主目录权限坑
    # L6：192MB 堆 + 8MB(maxBodyBytes)×8(maxInflight)=64MB 堆外 Buffer + SSE/连接开销，
    # 原来的 256m 在并发大上传时会 OOM，留够余量提到 384m（算式同步写在 .env.example）。
    mem_limit: 384m
    restart: unless-stopped
    # M5：core-net 是唯一能访问 core 的网络；default/1panel-network 保留出网与反代接入。
    networks:
      core-net:
      default:
    # F24：同样收紧权限（镜像本身已经是 USER node）
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # gateway 只写 /app/data 卷与 /app/config bind，其余文件系统只读
    read_only: true
    tmpfs:
      - /tmp
    # F25：日志轮转
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # B18：探 /ready（readiness）而不是 /health（liveness）。
    # /health 只说明进程活着 —— core 崩溃/OOM/断网后它照样 200，探活于是形同虚设。
    # /ready 会真探一次 core：不可达就 503 → 容器被标 unhealthy（面板/监控/反代都能据此摘流）。
    # start_period 30s 给足首刷额度 + 建立上游连接的时间，避免启动瞬间抖动误判；
    # timeout 5s > 网关内部 2s 探测硬上界，保证超时只可能来自网关自身而不是探针。
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3051/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  cc-manage-data:

networks:
  # M5：internal 网络没有出网路由，也没有别的容器能挂上来 → core 只对 gateway 可见。
  core-net:
    internal: true
  # 只有 core 自己挂：给它一条出网路由（CC 上游），但不引入任何同网邻居。
  core-egress:
