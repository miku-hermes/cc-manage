services:
  core:
    image: ghcr.io/miku-hermes/cc-manage-core:latest
  gateway:
    image: ghcr.io/miku-hermes/cc-manage-gateway:latest
    networks:
      default:
      # openresty（1Panel 的 Docker 反代）通过这个别名访问网关
      1panel-network:
        aliases:
          - cc-manage-gateway

networks:
  1panel-network:
    external: true
