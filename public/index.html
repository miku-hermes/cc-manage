<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>cc-manage · 额度面板</title>
<style>
  /* 原生控件配色（滚动条 / 表单 / 日期选择器）：基础 + 手动主题分派。
     B2-13 契约要求这块留在 HTML 内联 <style> 里；拆分后仍原样保留。 */
  :root { color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
</style>
<script>
/* 预绘制主题：首次绘制前套用已保存/系统偏好的主题，避免浅色→深色闪一下。
   只在 localStorage 可用且确有保存值、或系统偏好深色时才写 data-theme；
   localStorage 抛错时什么也不做，交给 CSS 默认浅色兜底。 */
try {
  var t = localStorage.getItem('cc-manage-theme');
  if (t === 'light' || t === 'dark') {
    document.documentElement.setAttribute('data-theme', t);
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
} catch (e) { /* 忽略 */ }
</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>

<header class="header">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.5 6.2 6.2 2.5-6.2 2.5-2.5 6.2-2.5-6.2L3.3 11.3l6.2-2.5z"/></svg>
    </span>
    <span class="brand-name">cc-manage</span>
  </div>

  <div class="tools">
    <label class="search-box" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.4-3.4"/>
      </svg>
      <input id="search" type="search" placeholder="搜索账号" aria-label="搜索账号" autocomplete="off">
    </label>
    <button id="theme" class="icon-btn" type="button" title="切换主题" aria-label="切换主题">
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
    </button>
    <a class="admin-link" href="/admin" aria-label="登录后台" title="账号密码登录后台，管理 CC key 与客户端 key">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.2"/><path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/></svg>
    </a>
    <span id="keyhint" class="hint"></span>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-main">
      <h1 id="greeting" class="greeting">下午好</h1>
      <div class="hero-balance">
        <b id="balance">—</b>
        <span id="bal-label" class="bal-label">剩余额度（USD）</span>
      </div>
      <p id="bal-breakdown" class="hero-breakdown aux-text"></p>
      <p class="hero-sub">网关状态 <span id="health" class="pill">加载中…</span></p>
      <p class="hero-meta aux-text"><span id="upstream"></span><span id="updated"></span><span id="cadence" class="hero-cadence"></span></p>
    </div>
    <div class="hero-aside">
      <div class="hero-clock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
        <span id="clock">--:--:--</span>
      </div>
      <div id="date" class="hero-date"></div>
      <div class="hero-tokens">累计 token <b id="tokens">0</b></div>
    </div>
  </section>

  <section class="kpis">
    <div class="kpi" id="kpi-box-accounts">
      <div class="kpi-head">
        <span class="kpi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg></span>
        <span class="kpi-label">账号数</span>
      </div>
      <b id="kpi-accounts">—</b>
      <small id="kpi-sub-accounts" class="kpi-sub"></small>
    </div>
    <div class="kpi" id="kpi-box-available">
      <div class="kpi-head">
        <span class="kpi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18v-2"/><path d="M9 18v-6"/><path d="M14 18v-10"/><path d="M19 18V6"/></svg></span>
        <span class="kpi-label">可用</span>
      </div>
      <b id="kpi-available">—</b>
      <small id="kpi-sub-available" class="kpi-sub"></small>
    </div>
    <div class="kpi" id="kpi-box-paused">
      <div class="kpi-head">
        <span class="kpi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg></span>
        <span class="kpi-label">暂停中</span>
      </div>
      <b id="kpi-paused">—</b>
      <small id="kpi-sub-paused" class="kpi-sub"></small>
    </div>
    <div class="kpi" id="kpi-box-unavailable">
      <div class="kpi-head">
        <span class="kpi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg></span>
        <span class="kpi-label">不可用</span>
      </div>
      <b id="kpi-unavailable">—</b>
      <small id="kpi-sub-unavailable" class="kpi-sub"></small>
    </div>
    <div class="kpi" id="kpi-box-total">
      <div class="kpi-head">
        <span class="kpi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span>
        <span class="kpi-label">总请求</span>
      </div>
      <b id="kpi-total">—</b>
      <small id="kpi-sub-total" class="kpi-sub"></small>
    </div>
    <div class="kpi" id="kpi-box-errors">
      <div class="kpi-head">
        <span class="kpi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>
        <span class="kpi-label">上游错误数</span>
      </div>
      <!-- 口径：errors 只统计上游/网关故障（5xx/中断/鉴权），客户端 4xx（模型名错等）单独计
           clientErrors，不再把「客户端用错模型」算成网关变红。 -->
      <b id="kpi-errors">—</b>
      <small id="kpi-sub-errors" class="kpi-sub"></small>
    </div>
  </section>

  <section class="filters" id="filters" role="group" aria-label="状态筛选"></section>

  <section class="grid" id="cards"></section>
</main>


<script src="js/utils.js"></script>
<script src="js/anim.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/theme.js"></script>
<script src="js/render-kpis.js"></script>
<script src="js/render-hero.js"></script>
<script src="js/render-cards.js"></script>
<script src="js/app.js"></script>
<script>
/* 引导块：外部脚本已按依赖顺序加载（utils → api → state → render-* → app）。
   这里保留标签条渐隐状态类的维护（B2-17 契约要求这段留在 HTML 内联脚本里），
   并把测试 vm 需要的全局暴露出去；启动逻辑在 js/app.js 的 boot()。 */
function syncTagMasks() {
  for (const el of document.querySelectorAll('#cards .tags')) {
    const max = Math.max(0, (el.scrollWidth || 0) - (el.clientWidth || 0));
    const scrollable = max > 1;
    el.classList.toggle('is-scrollable', scrollable);
    el.classList.toggle('at-end', scrollable && (el.scrollLeft || 0) >= max - 1);
  }
}
$('cards').addEventListener('scroll', syncTagMasks, true);
window.state = state;
window.renderCards = renderCards;
window.syncTagMasks = syncTagMasks;
boot();
</script>
</body>
</html>
