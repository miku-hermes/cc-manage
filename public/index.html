<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-manage · 额度面板</title>
<style>
  :root {
    --bg-primary: #f8f6f9;
    --bg-secondary: #ffffff;
    --bg-tertiary: #f0edf3;
    --bg-card: #ffffff;
    --bg-card-hover: #faf8fc;
    --text-primary: #2d1b3d;
    --text-secondary: #6b5a7d;
    --text-tertiary: #9b8aad;
    --border-color: #e8e0f0;
    --border-light: #f0eaf5;
    --accent: #e8668a;
    --accent-hover: #d44a72;
    --accent-light: #fce4ec;
    --success: #4caf7d;
    --warning: #f5a623;
    --danger: #e74c5e;
    --info: #5c9ced;
    --shadow-soft: 0 1px 2px rgba(45, 27, 61, .05);
    --shadow-lift: 0 8px 22px rgba(232, 102, 138, .12);
    --radius-card: 14px;
    --radius-sm: 12px;
    --pill: 999px;
  }
  /* 暗色（跟随系统，或手动 data-theme="dark" 覆盖） */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-primary: #1a1119;
      --bg-secondary: #221826;
      --bg-tertiary: #2a1f2e;
      --bg-card: #2a1f2e;
      --bg-card-hover: #332538;
      --text-primary: #e8e2ec;
      --text-secondary: #b8adc2;
      --text-tertiary: #8a8290;
      --border-color: #3a2d40;
      --border-light: #2f2434;
      --accent: #f2a0b5;
      --accent-hover: #e8668a;
      --accent-light: #3d2430;
      --success: #6ddba0;
      --warning: #ffc266;
      --danger: #ff8095;
      --info: #7fb3f5;
      --shadow-soft: 0 1px 2px rgba(0, 0, 0, .25);
      --shadow-lift: 0 8px 22px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg-primary: #1a1119;
    --bg-secondary: #221826;
    --bg-tertiary: #2a1f2e;
    --bg-card: #2a1f2e;
    --bg-card-hover: #332538;
    --text-primary: #e8e2ec;
    --text-secondary: #b8adc2;
    --text-tertiary: #8a8290;
    --border-color: #3a2d40;
    --border-light: #2f2434;
    --accent: #f2a0b5;
    --accent-hover: #e8668a;
    --accent-light: #3d2430;
    --success: #6ddba0;
    --warning: #ffc266;
    --danger: #ff8095;
    --info: #7fb3f5;
    --shadow-soft: 0 1px 2px rgba(0, 0, 0, .25);
    --shadow-lift: 0 8px 22px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-primary);
    color: var(--text-primary);
    font: 14px/1.6 ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .2s, color .2s;
  }
  .mono { font-family: ui-monospace, Menlo, Consolas, "Cascadia Mono", monospace; }

  /* ── 飘落的樱花花瓣 ───────────────────────────────────── */
  .petals { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .petal {
    position: absolute; top: -8vh; width: 10px; height: 10px; opacity: .55;
    border-radius: 60% 40% 55% 45% / 50% 60% 40% 50%;
    background: var(--accent);
    animation-name: petal-fall; animation-timing-function: linear; animation-iteration-count: infinite;
  }
  @keyframes petal-fall {
    0%   { transform: translate3d(0, -10vh, 0) rotate(0deg); }
    25%  { transform: translate3d(4vw, 25vh, 0) rotate(95deg); }
    50%  { transform: translate3d(-3vw, 55vh, 0) rotate(190deg); }
    75%  { transform: translate3d(3vw, 84vh, 0) rotate(280deg); }
    100% { transform: translate3d(-2vw, 116vh, 0) rotate(360deg); }
  }

  /* ── 顶部导航栏 ───────────────────────────────────────── */
  .header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 14px 24px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 30px; height: 30px; border-radius: var(--pill); display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: #fff; flex: none;
  }
  .logo svg { width: 17px; height: 17px; }
  .brand-name { font-size: 17px; font-weight: 700; letter-spacing: .4px; }

  .tools {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px; border: 1px solid var(--border-color); border-radius: var(--pill);
    background: var(--bg-tertiary); box-shadow: var(--shadow-soft);
  }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: var(--pill);
    background: var(--bg-card); border: 1px solid var(--border-light); color: var(--text-tertiary);
  }
  .search-box svg { width: 15px; height: 15px; flex: none; }
  .search-box input {
    border: none; outline: none; background: transparent; color: var(--text-primary);
    font: inherit; font-size: 13px; width: 170px;
  }
  .search-box input::placeholder { color: var(--text-tertiary); }

  button { font: inherit; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 7px 14px; border-radius: var(--pill);
    border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-secondary);
    font-size: 13px; transition: color .15s, border-color .15s, background .15s;
  }
  .btn:hover { color: var(--accent); border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: progress; }
  .btn svg { width: 15px; height: 15px; }
  .icon-btn {
    display: grid; place-items: center; cursor: pointer; width: 34px; height: 34px;
    border-radius: var(--pill); border: 1px solid var(--border-color);
    background: var(--bg-card); color: var(--text-secondary);
    transition: color .15s, border-color .15s;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn svg { width: 17px; height: 17px; }
  .ico-sun { display: none; }
  :root[data-theme="dark"] .ico-sun { display: block; }
  :root[data-theme="dark"] .ico-moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .ico-sun { display: block; }
    :root:not([data-theme="light"]) .ico-moon { display: none; }
  }

  .admin-link {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    color: var(--text-secondary); font-size: 13px; padding: 7px 15px;
    border-radius: var(--pill); border: 1px solid var(--border-color); background: var(--bg-card);
    transition: color .15s, border-color .15s;
  }
  .admin-link:hover { color: var(--accent); border-color: var(--accent); }
  .admin-link svg { width: 15px; height: 15px; }
  .hint { font-size: 12px; color: var(--warning); }

  /* ── 主区域 ───────────────────────────────────────────── */
  main { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 22px 24px 8px; }

  .hero {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap;
    padding: 26px 28px; border-radius: var(--radius-card);
    border: 1px solid var(--border-color); background: var(--bg-card); box-shadow: var(--shadow-soft);
    background-image: radial-gradient(620px 210px at 100% 0%, var(--accent-light), transparent 72%);
  }
  .greeting { margin: 0; font-size: 30px; font-weight: 700; color: var(--accent); letter-spacing: .5px; }
  .hero-sub { margin: 8px 0 0; color: var(--text-secondary); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .hero-meta { margin: 10px 0 0; color: var(--text-tertiary); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  .hero-right { text-align: right; }
  .hero-date { color: var(--text-secondary); font-size: 13px; }
  .hero-clock {
    font-size: 42px; font-weight: 700; line-height: 1.15; color: var(--accent);
    font-variant-numeric: tabular-nums; letter-spacing: 1px;
  }
  .hero-tokens { margin-top: 4px; font-size: 12px; color: var(--text-tertiary); }
  .hero-tokens b { color: var(--text-secondary); font-variant-numeric: tabular-nums; }

  .pill {
    display: inline-block; padding: 3px 12px; border-radius: var(--pill); font-size: 12px;
    color: var(--text-secondary); background: var(--bg-tertiary); border: 1px solid var(--border-color);
  }
  .pill.ok { color: var(--success); border-color: var(--success); }
  .pill.bad { color: var(--danger); border-color: var(--danger); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0; }
  .kpi {
    padding: 14px 16px; border-radius: var(--radius-sm);
    background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: var(--shadow-soft);
  }
  .kpi b { display: block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi b.bad { color: var(--danger); }
  .kpi span { font-size: 12px; color: var(--text-tertiary); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 16px; }
  .card {
    padding: 18px; border-radius: var(--radius-card);
    background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: var(--shadow-soft);
    transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); background: var(--bg-card-hover); box-shadow: var(--shadow-lift); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card h2 { margin: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-display { font-size: 12px; font-weight: 400; color: var(--text-tertiary); }
  .dot { width: 8px; height: 8px; border-radius: var(--pill); background: var(--success); flex: none; }
  .card.paused .dot { background: var(--warning); }
  .card.invalid .dot { background: var(--danger); }
  .card-sub { margin-top: 4px; font-size: 12px; color: var(--text-tertiary); word-break: break-all; }
  .card-money { margin: 14px 0 2px; display: flex; align-items: baseline; gap: 8px; }
  .card-money b { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card-money small { font-size: 12px; color: var(--text-tertiary); }
  .card-credits { font-size: 12px; color: var(--text-tertiary); }
  .bars { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .bar-head { display: flex; align-items: baseline; gap: 10px; font-size: 12px; margin-bottom: 4px; }
  .bar-label { color: var(--text-secondary); }
  .bar-num { margin-left: auto; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .bar-pct { color: var(--text-secondary); font-variant-numeric: tabular-nums; min-width: 46px; text-align: right; }
  .bar { height: 8px; border-radius: var(--pill); background: var(--bg-tertiary); border: 1px solid var(--border-light); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: var(--pill); transition: width .45s ease; }
  .s-ok > i { background: var(--success); }
  .s-warn > i { background: var(--warning); }
  .s-bad > i { background: var(--danger); }
  .card-usage { margin-top: 12px; font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .tags { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 11px; padding: 3px 10px; border-radius: var(--pill);
    background: var(--bg-tertiary); border: 1px solid var(--border-light); color: var(--text-secondary);
  }
  .tag.ok { color: var(--success); border-color: var(--success); }
  .tag.bad { color: var(--danger); border-color: var(--danger); }
  .tag.warn { color: var(--warning); border-color: var(--warning); }
  .err { margin-top: 12px; font-size: 12px; color: var(--danger); word-break: break-all; }
  .empty { color: var(--text-secondary); text-align: center; padding: 34px 18px; }

  footer { position: relative; z-index: 1; text-align: center; padding: 26px 16px 40px; font-size: 12px; color: var(--text-tertiary); }

  /* ── 响应式 ───────────────────────────────────────────── */
  @media (max-width: 820px) {
    .header { padding: 12px 16px; }
    .tools { width: 100%; border-radius: var(--radius-sm); }
    .search-box { flex: 1 1 160px; }
    .search-box input { width: 100%; }
    .admin-link { flex: 1 1 auto; justify-content: center; }
    main { padding: 18px 16px 4px; }
    .hero { padding: 20px; }
    .greeting { font-size: 24px; }
    .hero-clock { font-size: 32px; }
    .hero-right { text-align: left; }
  }

  @media (prefers-reduced-motion: reduce) {
    .petals { display: none; }
    .card, .bar > i, body { transition: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>

<header class="header">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.5 6.2 6.2 2.5-6.2 2.5-2.5 6.2-2.5-6.2L3.3 11.3l6.2-2.5z"/></svg>
    </span>
    <span class="brand-name">cc-manage</span>
  </div>

  <div class="tools">
    <label class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.4-3.4"/>
      </svg>
      <input id="search" type="search" placeholder="搜索账号 / keyId" aria-label="搜索账号" autocomplete="off">
    </label>
    <button id="theme" class="icon-btn" type="button" title="切换主题" aria-label="切换主题">
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
    </button>
    <button id="refresh" class="btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.4 6.2"/><path d="M20 5v6h-6"/></svg>
      刷新额度
    </button>
    <a class="admin-link" href="/admin" title="账号密码登录后台，管理 CC key 与客户端 key">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.2"/><path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/></svg>
      登录后台
    </a>
    <span id="keyhint" class="hint"></span>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-left">
      <h1 id="greeting" class="greeting">下午好</h1>
      <p class="hero-sub">欢迎回来，网关运行中 <span id="health" class="pill">加载中…</span></p>
      <p class="hero-meta"><span id="upstream"></span><span id="updated"></span></p>
    </div>
    <div class="hero-right">
      <div id="date" class="hero-date"></div>
      <div id="clock" class="hero-clock">--:--:--</div>
      <div class="hero-tokens">累计 token <b id="tokens">0</b></div>
    </div>
  </section>

  <section class="kpis">
    <div class="kpi"><b id="kpi-accounts">—</b><span>账号数</span></div>
    <div class="kpi"><b id="kpi-available">—</b><span>可用</span></div>
    <div class="kpi"><b id="kpi-paused">—</b><span>暂停中</span></div>
    <div class="kpi"><b id="kpi-concurrency">—</b><span>在途请求</span></div>
    <div class="kpi"><b id="kpi-total">—</b><span>总请求</span></div>
    <div class="kpi"><b id="kpi-errors">—</b><span>错误数</span></div>
  </section>

  <section class="grid" id="cards"></section>
</main>

<footer>公开只读面板 · 不显示任何完整 key（仅 keyId / keyPrefix / 额度百分比）· 管理请<a href="/admin">登录后台</a> · cc-manage</footer>

<script>
const $ = (id) => document.getElementById(id);
const THEME_STORE = 'cc-manage-theme';
const state = { data: null, filter: '' };

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function num(n) { const v = Number(n); return Number.isFinite(v) ? v.toLocaleString('zh-CN') : '0'; }
function money(n) { const v = Number(n); return Number.isFinite(v) ? v.toFixed(2) : '—'; }
function pctText(p) { const v = Number(p); return (p === null || p === undefined || !Number.isFinite(v)) ? '—' : v.toFixed(1) + '%'; }
function cls(p) { const v = Number(p); if (p === null || p === undefined || !Number.isFinite(v)) return 's-ok'; return v >= 90 ? 's-bad' : v >= 70 ? 's-warn' : 's-ok'; }
function timeText(ts) { const d = new Date(ts); return Number.isNaN(d.getTime()) ? '—' : d.toLocaleTimeString('zh-CN'); }

function bar(label, w) {
  const has = w && typeof w === 'object';
  const pct = has && typeof w.percent === 'number' ? w.percent : null;
  const used = has && typeof w.used === 'number' ? money(w.used) : '—';
  const cap = has && typeof w.cap === 'number' ? money(w.cap) : '—';
  return '<div class="bar-head"><span class="bar-label">' + label + '</span>'
    + '<span class="bar-num">' + used + ' / ' + cap + '</span>'
    + '<span class="bar-pct">' + pctText(pct) + '</span></div>'
    + '<div class="bar ' + cls(pct) + '"><i style="width:' + (pct === null ? 0 : Math.max(0, Math.min(100, pct))) + '%"></i></div>';
}

function card(a) {
  const q = a.lastQuota;
  const c = q && q.credits ? q.credits : null;
  const cardCls = a.authInvalid ? 'invalid' : a.paused ? 'paused' : '';
  const tags = [];
  tags.push(a.enabled ? '<span class="tag ok">已启用</span>' : '<span class="tag warn">手动停用</span>');
  tags.push(a.available ? '<span class="tag ok">可调度</span>' : '<span class="tag bad">不可用</span>');
  if (a.paused) tags.push('<span class="tag warn">暂停至 ' + esc(timeText(a.pausedUntil)) + '</span>');
  if (a.authInvalid) tags.push('<span class="tag bad">鉴权失效</span>');
  tags.push('<span class="tag">在途 ' + esc(num(a.concurrency)) + '</span>');
  if (q && q.plan) tags.push('<span class="tag">套餐 ' + esc(q.plan.planId ?? '-') + '</span>');

  return '<article class="card ' + cardCls + '">'
    + '<div class="card-head"><h2>' + esc(a.name)
    + (q && q.displayName ? '<span class="card-display">' + esc(q.displayName) + '</span>' : '') + '</h2>'
    + '<span class="dot" aria-hidden="true"></span></div>'
    + '<div class="card-sub mono">' + esc(a.keyId) + ' · ' + esc(a.keyPrefix) + '…</div>'
    + '<div class="card-money"><b>' + money(q ? q.remaining : null) + '</b><small>剩余额度</small></div>'
    + (c
      ? '<div class="card-credits">月度 ' + money(c.monthlyCredits) + ' · 购买 ' + money(c.purchasedCredits) + ' · 赠送 ' + money(c.freeCredits) + '</div>'
      : '<div class="card-credits">尚未获取额度快照</div>')
    + '<div class="bars">'
    + bar('5 小时窗口', q && q.fiveHour)
    + bar('本周窗口', q && q.weekly)
    + bar('本月周期', q && q.monthly)
    + '</div>'
    + (q && q.usage ? '<div class="card-usage">本周期 token ' + esc(num(q.usage.totalTokens))
      + (q.usage.totalCost === undefined ? '' : ' · 花费 ' + money(q.usage.totalCost)) + '</div>' : '')
    + '<div class="tags">' + tags.join('') + '</div>'
    + (a.lastError ? '<div class="err">最近错误：' + esc(a.lastError) + '</div>' : '')
    + '</article>';
}

function renderCards() {
  const all = state.data ? state.data.accounts : [];
  const f = state.filter.trim().toLowerCase();
  const list = f
    ? all.filter((a) => [a.name, a.keyId, a.keyPrefix, a.lastQuota && a.lastQuota.displayName]
      .some((v) => String(v ?? '').toLowerCase().includes(f)))
    : all;
  if (!list.length) {
    $('cards').innerHTML = '<div class="card empty">' + (all.length
      ? '没有匹配「' + esc(state.filter) + '」的账号。'
      : '账号池为空。请在 accounts.json 里配置账号，或用 CC_ACCOUNTS 环境变量注入。') + '</div>';
    return;
  }
  $('cards').innerHTML = list.map(card).join('');
}

function render(d) {
  state.data = d;
  const s = d.summary || {};
  const st = d.stats || {};

  $('health').textContent = '可用 ' + num(s.available) + ' / ' + num(s.accounts) + ' · 在途 ' + num(s.concurrency);
  $('health').className = 'pill ' + (Number(s.available) > 0 ? 'ok' : 'bad');
  $('updated').textContent = '更新于 ' + timeText(d.now);
  $('upstream').textContent = '内核 ' + String(d.upstreamProxyUrl ?? '') + (d.allowPassthrough ? ' · 已开启直连透传' : '');
  $('tokens').textContent = num(st.totalTokens);

  $('kpi-accounts').textContent = num(s.accounts);
  $('kpi-available').textContent = num(s.available);
  $('kpi-paused').textContent = num(s.paused);
  $('kpi-concurrency').textContent = num(s.concurrency);
  $('kpi-total').textContent = num(st.total);
  $('kpi-errors').textContent = num(st.errors);
  $('kpi-errors').className = Number(st.errors) > 0 ? 'bad' : '';

  renderCards();
}

// ── 数据：公开只读，不鉴权（没有完整 key，只有 keyId / keyPrefix / 额度百分比）──
/** 面板取数：同源公开接口，不需要任何凭证。 */
function apiFetch(path, opts = {}) {
  return fetch(path, Object.assign({ credentials: 'same-origin' }, opts));
}
function setHint(text, bad) {
  const el = $('keyhint');
  el.textContent = text || '';
  el.className = bad ? 'hint bad' : 'hint';
}
function clearKpis() {
  for (const id of ['kpi-accounts', 'kpi-available', 'kpi-paused', 'kpi-concurrency', 'kpi-total', 'kpi-errors']) {
    $(id).textContent = '—';
    $(id).className = '';
  }
}
function showPrivate() {
  state.data = null;
  $('health').textContent = '需要登录后台';
  $('health').className = 'pill bad';
  $('tokens').textContent = '0';
  $('upstream').textContent = '';
  $('updated').textContent = '';
  clearKpis();
  $('cards').innerHTML = '<div class="card empty">当前实例已开启隐私模式（<span class="mono">PUBLIC_DASHBOARD=0</span>）：'
    + '请先<a href="/admin">登录后台</a>再查看面板数据。</div>';
}

async function load() {
  try {
    const r = await apiFetch('/api/status');
    if (r.status === 401) { showPrivate(); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    setHint('', false);
    render(await r.json());
  } catch (e) {
    $('health').textContent = '加载失败：' + e.message;
    $('health').className = 'pill bad';
  }
}

$('refresh').onclick = async () => {
  $('refresh').disabled = true;
  try {
    const r = await apiFetch('/api/accounts/refresh', { method: 'POST' });
    if (r.status === 401) showPrivate();
    else if (r.ok) render(await r.json());
  } catch (e) { /* 保持面板可用 */ }
  finally { $('refresh').disabled = false; }
};
$('search').addEventListener('input', (e) => { state.filter = e.target.value || ''; renderCards(); });

// ── 主题：默认跟随系统，按钮手动切换 ────────────────────────────────
function storedTheme() {
  try { return localStorage.getItem(THEME_STORE) || ''; } catch { return ''; }
}
function prefersDark() { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
/** 当前生效主题：手动选择优先，否则跟随系统。 */
function currentTheme() { return document.documentElement.getAttribute('data-theme') || (prefersDark() ? 'dark' : 'light'); }
/** 手动切换：写 data-theme 并记住选择。 */
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem(THEME_STORE, t); } catch { /* 忽略 */ }
}
$('theme').onclick = () => setTheme(currentTheme() === 'dark' ? 'light' : 'dark');

// ── 问候语 + 实时时钟 ───────────────────────────────────────────────
function greetingOf(h) { return h < 5 ? '凌晨好' : h < 12 ? '早上好' : h < 18 ? '下午好' : '晚上好'; }
function tick() {
  const now = new Date();
  $('clock').textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
  $('date').textContent = now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
  $('greeting').textContent = greetingOf(now.getHours());
}

// ── 樱花花瓣 ────────────────────────────────────────────────────────
function petals() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const host = $('petals');
  const tints = ['var(--accent)', '#f7b6c9', '#fce4ec', 'var(--accent-hover)'];
  for (let i = 0; i < 10; i++) {
    const p = document.createElement('span');
    const size = 7 + Math.random() * 7;
    p.className = 'petal';
    p.style.left = (Math.random() * 100).toFixed(2) + 'vw';
    p.style.width = size.toFixed(1) + 'px';
    p.style.height = size.toFixed(1) + 'px';
    p.style.background = tints[i % tints.length];
    p.style.opacity = (0.25 + Math.random() * 0.4).toFixed(2);
    p.style.animationDuration = (11 + Math.random() * 11).toFixed(1) + 's';
    p.style.animationDelay = (-Math.random() * 20).toFixed(1) + 's';
    host.appendChild(p);
  }
}

const savedTheme = storedTheme();
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
petals();
tick();
setInterval(tick, 1000);

load();
setInterval(() => { if (!document.hidden) load(); }, 5000);
</script>
</body>
</html>
