<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>cc-manage · 额度面板</title>
<style>
  /* ── 设计令牌（亮色）──────────────────────────────────────
     栅格：--gutter 统一页面左右内边距，--card-pad 统一卡片内边距，
     所有内容块左边缘都落在同一条竖线上。                          */
  :root {
    color-scheme: light dark;

    /* 栅格 / 间距 */
    --page-max: 1280px;
    --gutter: 24px;
    --card-pad: 20px;

    /* 表面海拔：页面底 → 卡片 → 卡片内嵌区块 */
    --surface-0: #f8f6f9;
    --surface-1: #ffffff;
    --surface-2: #faf8fc;
    --border: #e8e0f0;
    --border-strong: #d8cce4;

    /* 文字（小字至少 4.5:1） */
    --text-primary: #2d1b3d;
    --text-secondary: #5f4d72;
    --text-tertiary: #6f5d82;

    /* 语义色 */
    --accent: #e8668a;
    --accent-hover: #d44a72;
    --accent-light: #fce4ec;
    --accent-ink: #b03a5c;
    --accent-solid: #c5395f;
    --accent-solid-hover: #b03a5c;
    --on-accent-solid: #ffffff;
    --danger-fill: #c8303f;
    --on-danger-fill: #ffffff;
    --focus: #c5395f;
    --success: #257a50;
    --success-light: #e4f5ec;
    --warning: #96600a;
    --warning-light: #fdf1dd;
    --danger: #c8303f;
    --danger-light: #fde9eb;
    --info: #2f6ab3;

    /* 字阶 */
    --fs-2xs: 10.5px;
    --fs-xs: 11px;
    --fs-sm: 13px;
    --fs-base: 14px;
    --fs-md: 16px;
    --fs-lg: 20px;
    --fs-xl: 28px;
    --fs-hero: clamp(40px, 6vw, 64px);

    /* 行高 */
    --lh-body: 1.6;
    --lh-heading: 1.25;
    --lh-hero: 1;

    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", ui-sans-serif, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Mono", monospace;

    --shadow-soft: 0 1px 2px rgba(45, 27, 61, .06);
    --shadow-lift: 0 8px 22px rgba(232, 102, 138, .14);
    --radius-card: 14px;
    --radius-sm: 10px;
    --pill: 999px;

    --header-h: 58px;
  }

  /* 暗色（跟随系统，或手动 data-theme="dark" 覆盖） */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface-0: #17111c;
      --surface-1: #221a29;
      --surface-2: #2b2133;
      --border: #3d3046;
      --border-strong: #4d3d58;

      --text-primary: #ece6f0;
      --text-secondary: #c3b8cd;
      --text-tertiary: #ab9fb8;

      --accent: #f2a0b5;
      --accent-hover: #e8668a;
      --accent-light: #3d2430;
      --accent-ink: #f7c0cf;
      --accent-solid: #f2a0b5;
      --accent-solid-hover: #e8668a;
      --on-accent-solid: #241a2b;
      --danger-fill: #ff8095;
      --on-danger-fill: #241a2b;
      --focus: #f2a0b5;
      --success: #6ddba0;
      --success-light: #1e3a2c;
      --warning: #ffc266;
      --warning-light: #3a2e18;
      --danger: #ff8095;
      --danger-light: #3d2029;
      --info: #7fb3f5;

      --shadow-soft: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-lift: 0 8px 24px rgba(0, 0, 0, .45);
    }
  }
  :root[data-theme="dark"] {
    --surface-0: #17111c;
    --surface-1: #221a29;
    --surface-2: #2b2133;
    --border: #3d3046;
    --border-strong: #4d3d58;

    --text-primary: #ece6f0;
    --text-secondary: #c3b8cd;
    --text-tertiary: #ab9fb8;

    --accent: #f2a0b5;
    --accent-hover: #e8668a;
    --accent-light: #3d2430;
    --accent-ink: #f7c0cf;
    --accent-solid: #f2a0b5;
    --accent-solid-hover: #e8668a;
    --on-accent-solid: #241a2b;
    --danger-fill: #ff8095;
    --on-danger-fill: #241a2b;
    --focus: #f2a0b5;
    --success: #6ddba0;
    --success-light: #1e3a2c;
    --warning: #ffc266;
    --warning-light: #3a2e18;
    --danger: #ff8095;
    --danger-light: #3d2029;
    --info: #7fb3f5;

    --shadow-soft: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-lift: 0 8px 24px rgba(0, 0, 0, .45);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--surface-0);
    color: var(--text-primary);
    font: var(--fs-base)/var(--lh-body) var(--font-sans);
    -webkit-font-smoothing: antialiased;
    transition: background .2s, color .2s;
  }
  h1, h2, h3 { line-height: var(--lh-heading); }
  .mono { font-family: var(--font-mono); }

  /* ── 极淡的左上角粉色光晕（永远在内容之下）────────────────── */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(720px 420px at 0% 0%, var(--accent-light), transparent 68%);
    opacity: .55;
  }

  /* ── 飘落的樱花花瓣（容器裁切，永不被视口裁断）────────────── */
  .petals { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .petal {
    position: absolute; top: 0; opacity: .2; will-change: transform;
    /* 花瓣形，不是圆点 */
    border-radius: 50% 0 50% 50%;
    background: var(--accent);
    animation-name: petal-fall; animation-timing-function: linear; animation-iteration-count: infinite;
  }
  @keyframes petal-fall {
    0%   { transform: translate3d(0, -12vh, 0) rotate(0deg); }
    50%  { transform: translate3d(5vw, 50vh, 0) rotate(180deg); }
    100% { transform: translate3d(-4vw, 112vh, 0) rotate(360deg); }
  }

  /* ── 顶部导航栏 ────────────────────────────────────────── */
  .header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    min-height: var(--header-h);
    padding: 10px max(var(--gutter), calc((100% - var(--page-max)) / 2 + var(--gutter)));
    background: var(--surface-1);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 30px; height: 30px; border-radius: var(--pill); display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: #fff; flex: none;
  }
  .logo svg { width: 16px; height: 16px; }
  .brand-name { font-size: var(--fs-md); font-weight: 700; letter-spacing: .3px; }

  .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .search-box {
    display: flex; align-items: center; gap: 8px; height: 36px;
    min-width: 0; flex: 0 1 auto;           /* 关键：窄屏优先压缩，不把工具栏撑成两行 */
    padding: 0 12px; border-radius: var(--radius-sm);
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-tertiary);
  }
  .search-box:focus-within { border-color: var(--accent-solid); box-shadow: 0 0 0 3px var(--accent-light); }
  .search-box svg { width: 16px; height: 16px; flex: none; }
  .search-box input {
    border: none; background: transparent; color: var(--text-primary); min-width: 0;
    font: inherit; font-size: var(--fs-sm); width: 170px; flex: 1 1 60px;
  }
  .search-box input::placeholder { color: var(--text-tertiary); }

  button { font: inherit; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
    height: 36px; padding: 0 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong); background: var(--surface-1); color: var(--text-secondary);
    font-size: var(--fs-sm); transition: color .15s, border-color .15s, background .15s;
  }
  .btn:hover:not(:disabled) { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-light); }
  .btn:disabled { opacity: .5; cursor: progress; }
  .btn svg { width: 15px; height: 15px; }
  .icon-btn {
    display: grid; place-items: center; cursor: pointer; width: 36px; height: 36px;
    border-radius: var(--radius-sm); border: 1px solid var(--border-strong);
    background: var(--surface-1); color: var(--text-secondary);
    transition: color .15s, border-color .15s, background .15s;
  }
  .icon-btn:hover { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-light); }
  .icon-btn svg { width: 16px; height: 16px; }
  .ico-sun { display: none; }
  :root[data-theme="dark"] .ico-sun { display: block; }
  :root[data-theme="dark"] .ico-moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .ico-sun { display: block; }
    :root:not([data-theme="light"]) .ico-moon { display: none; }
  }

  .admin-link {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    flex: none; white-space: nowrap;
    color: var(--text-secondary); font-size: var(--fs-sm); height: 36px; padding: 0 14px;
    border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface-1);
    transition: color .15s, border-color .15s, background .15s;
  }
  .admin-link:hover { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-light); }
  .admin-link svg { width: 16px; height: 16px; }
  .hint { font-size: var(--fs-xs); color: var(--warning); }

  /* 统一焦点环 */
  :focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }

  /* ── 主区域（所有块左边缘对齐同一条竖线）────────────────── */
  main {
    position: relative; z-index: 1;
    max-width: var(--page-max); margin: 0 auto;
    padding: var(--gutter) var(--gutter) 8px;
    display: flex; flex-direction: column; gap: var(--gutter);
  }

  /* Hero：主角是余额 */
  .hero {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
    gap: 20px 28px;
    padding: var(--card-pad) var(--card-pad); border-radius: var(--radius-card);
    border: 1px solid var(--border); background: var(--surface-1); box-shadow: var(--shadow-soft);
  }
  .hero-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .greeting { margin: 0; font-size: var(--fs-xl); font-weight: 700; color: var(--accent-ink); letter-spacing: .01em; }
  .hero-balance {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 2px;
  }
  .hero-balance b {
    font-size: var(--fs-hero); font-weight: 700; line-height: var(--lh-hero);
    font-variant-numeric: tabular-nums; letter-spacing: -.01em; color: var(--text-primary);
  }
  .hero-balance .bal-label { font-size: var(--fs-sm); color: var(--text-secondary); }
  .hero-sub {
    margin: 2px 0 0; font-size: var(--fs-sm); color: var(--text-secondary);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .hero-meta {
    margin: 4px 0 0; color: var(--text-secondary); font-size: var(--fs-xs);
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .hero-meta span { overflow-wrap: anywhere; }
  /* 空的 span 不占位，否则 flex 的 gap 会多出一段空白 */
  .hero-meta span:empty { display: none; }
  .hero-cadence { color: var(--text-tertiary); }
  .hero-aside {
    display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right;
    min-width: 0;
  }
  .hero-clock {
    font-size: var(--fs-md); font-weight: 600; line-height: var(--lh-heading);
    color: var(--text-secondary); font-variant-numeric: tabular-nums;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .hero-clock svg { width: 16px; height: 16px; flex: none; opacity: .8; }
  .hero-date { color: var(--text-secondary); font-size: var(--fs-xs); }
  .hero-tokens { font-size: var(--fs-xs); color: var(--text-secondary); }
  .hero-tokens b { color: var(--text-primary); font-variant-numeric: tabular-nums; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--pill);
    font-size: var(--fs-xs); color: var(--text-secondary);
    background: var(--surface-2); border: 1px solid var(--border-strong);
  }
  .pill.ok { color: var(--success); border-color: var(--success); background: var(--success-light); }
  .pill.bad { color: var(--danger); border-color: var(--danger); background: var(--danger-light); }

  /* KPI：语义色 + 收紧高度 + 极小图标 */
  .kpis {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
  }
  .kpi {
    display: flex; align-items: center; gap: 10px;
    padding: 14px var(--card-pad); border-radius: var(--radius-sm);
    background: var(--surface-1); border: 1px solid var(--border); box-shadow: var(--shadow-soft);
  }
  .kpi-icon {
    display: grid; place-items: center; flex: none;
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border);
  }
  .kpi-icon svg { width: 16px; height: 16px; }
  .kpi-body { min-width: 0; }
  .kpi b {
    display: block; font-size: 24px; font-weight: 700; line-height: var(--lh-heading);
    font-variant-numeric: tabular-nums; color: var(--text-primary);
  }
  .kpi span {
    display: block; font-size: var(--fs-xs); color: var(--text-secondary);
    letter-spacing: .02em; margin-top: 2px;
  }
  .kpi.is-danger .kpi b, .kpi.is-danger .kpi-icon { color: var(--danger); }
  .kpi.is-danger .kpi-icon { border-color: var(--danger); background: var(--danger-light); }
  .kpi.is-warning .kpi b, .kpi.is-warning .kpi-icon { color: var(--warning); }
  .kpi.is-warning .kpi-icon { border-color: var(--warning); background: var(--warning-light); }
  .kpi.is-accent .kpi b, .kpi.is-accent .kpi-icon { color: var(--accent-ink); }
  .kpi.is-accent .kpi-icon { border-color: var(--accent); background: var(--accent-light); }
  .kpi.is-muted b { color: var(--text-tertiary); }

  /* ── 账号卡片网格：自适应铺满 ─────────────────────────── */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr));
    gap: 16px; align-items: start;
  }
  .card {
    padding: var(--card-pad); border-radius: var(--radius-card);
    background: var(--surface-1); border: 1px solid var(--border); box-shadow: var(--shadow-soft);
    transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-lift); }
  .card.empty { grid-column: 1 / -1; color: var(--text-secondary); text-align: center; padding: 34px var(--card-pad); }

  /* 卡片内部双栏：左信息+余额 / 右进度条 */
  .card-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; }
  .card-col-left { min-width: 0; }
  .card-col-right { min-width: 0; }
  @media (max-width: 620px) { .card-grid { grid-template-columns: minmax(0, 1fr); gap: 16px; } }

  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card h2 {
    margin: 0; font-size: var(--fs-md); font-weight: 700;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0;
  }
  .card-display { font-size: var(--fs-xs); font-weight: 400; color: var(--text-secondary); }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-secondary); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: var(--pill); background: var(--success); flex: none; }
  .card.paused .dot { background: var(--warning); }
  .card.invalid .dot { background: var(--danger); }

  /* ID 行：· 分隔、整体省略、不中间截断 */
  .card-sub {
    margin-top: 6px; font-size: var(--fs-xs); color: var(--text-secondary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* 额度快照新鲜度：相对时间，>10 分钟转 warning 色 */
  .card-fresh { margin-top: 6px; font-size: var(--fs-xs); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .card-fresh.is-stale { color: var(--warning); }
  .card-fresh.is-stale::before { content: '⚠ '; }

  .card-money { margin: 14px 0 2px; display: flex; align-items: baseline; gap: 8px; }
  .card-money b { font-size: var(--fs-xl); font-weight: 700; font-variant-numeric: tabular-nums; }
  .card-money small { font-size: var(--fs-sm); color: var(--text-secondary); }
  .card-credits { font-size: var(--fs-xs); color: var(--text-secondary); }

  /* 进度条 */
  .bars { display: flex; flex-direction: column; gap: 14px; }
  .bar-group { display: block; }
  /* 每个窗口什么时候重置 —— 和进度条同宽、比标签更弱 */
  .bar-reset { margin-top: 4px; color: var(--text-tertiary); font-size: var(--fs-2xs); font-variant-numeric: tabular-nums; }
  .bar-head { display: flex; align-items: baseline; gap: 10px; font-size: var(--fs-xs); margin-bottom: 5px; }
  .bar-label { color: var(--text-secondary); }
  /* 百分比独占右端（金额已收进 title，不再占行） */
  .bar-pct {
    margin-left: auto;
    color: var(--text-secondary); font-family: var(--font-mono);
    font-variant-numeric: tabular-nums; min-width: 52px; text-align: right;
  }
  .bar {
    height: 8px; border-radius: var(--pill); background: var(--surface-2);
    border: 1px solid var(--border); overflow: hidden;
  }
  .bar > i { display: block; height: 100%; border-radius: var(--pill); transition: width .45s ease; }
  .s-ok > i { background: var(--success); }
  .s-warn > i { background: var(--warning); }
  .s-bad > i { background: var(--danger); }

  .card-usage { margin-top: 12px; font-size: var(--fs-xs); color: var(--text-secondary); font-variant-numeric: tabular-nums; }

  /* 底部标签统一成 pill */
  .tags { margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    display: inline-block; font-size: var(--fs-xs); padding: 3px 10px; border-radius: var(--pill);
    background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text-secondary);
    white-space: nowrap;
  }
  .tag.ok { color: var(--success); border-color: var(--success); background: var(--success-light); }
  .tag.bad { color: var(--danger); border-color: var(--danger); background: var(--danger-light); }
  .tag.warn { color: var(--warning); border-color: var(--warning); background: var(--warning-light); }
  .tag.info { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-light); }

  .err { margin-top: 12px; font-size: var(--fs-xs); color: var(--danger); word-break: break-all; }


  @media (max-width: 640px) {
    :root { --gutter: 16px; --card-pad: 16px; }
    /* 窄屏固定 2 列：minmax(150px,1fr) 在 320px 会塌成 1 列 6 行 */
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    /* flex-wrap 按「基准宽度」决定换行，基准太大就会先换行再压缩；
       给搜索框一个小基准 + 可增长，窄屏就能挤在同一行 */
    .search-box { flex: 1 1 140px; }
    .search-box input { width: 100%; }
    .hero { grid-template-columns: minmax(0, 1fr); align-items: flex-start; }
    .hero-aside { align-items: flex-start; text-align: left; }
    .greeting { font-size: 22px; }
  }

  /* 极小屏（≤340px）：搜索框继续收缩，「登录后台」只显图标，工具栏保持一行。
     340 是临界值：327px 以下「图标+文字+主题按钮」就放不下了。 */
  @media (max-width: 340px) {
    .search-box { padding: 0 10px; }
    .search-box input { font-size: var(--fs-xs); }
    .admin-link { padding: 0 10px; }
    .admin-link-label { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .petals { display: none; }
    .card, .bar > i, body { transition: none; }
    .card:hover { box-shadow: var(--shadow-soft); border-color: var(--border); }
  }
</style>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>

<header class="header">
  <div class="brand">
    <span class="logo" aria-hidden="true">

<script>
const $ = (id) => document.getElementById(id);
const THEME_STORE = 'cc-manage-theme';
const state = { data: null, filter: '' };

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function num(n) { const v = Number(n); return Number.isFinite(v) ? v.toLocaleString('zh-CN') : '0'; }
function money(n) { const v = Number(n); return Number.isFinite(v) ? v.toFixed(2) : '—'; }
function pctText(p) { const v = Number(p); return (p === null || p === undefined || !Number.isFinite(v)) ? '—' : v.toFixed(1) + '%'; }
function cls(p) { const v = Number(p); if (p === null || p === undefined || !Number.isFinite(v)) return 's-ok'; return v >= 90 ? 's-bad' : v >= 70 ? 's-warn' : 's-ok'; }
function timeText(ts) { const d = new Date(ts); return Number.isNaN(d.getTime()) ? '—' : d.toLocaleTimeString('zh-CN'); }

/* ── 额度快照新鲜度 ────────────────────────────────────────────────
   fetchedAt 是后端已经有的字段；这里只做本地相对时间换算，不额外发请求。
   阈值不写死：由后端 /api/status 的 quotaPoll.idleIntervalMs 决定（2 倍空闲间隔），
   这样把空闲间隔从 5 分钟调到 10 分钟也不会误报「过旧」。 */
const DEFAULT_STALE_MS = 20 * 60 * 1000;   // 拿不到配置时的兜底：2 × 10 分钟
let staleMs = DEFAULT_STALE_MS;
/** 按后端轮询配置更新阈值；非正数视为「轮询已关闭」，此时永不判过旧。 */
function setStaleFrom(status) {
  const idle = Number(status?.quotaPoll?.idleIntervalMs);
  staleMs = Number.isFinite(idle) && idle > 0 ? idle * 2 : Infinity;
}
function relText(ts, at = Date.now()) {
  const t = Number(ts);
  if (!Number.isFinite(t) || t <= 0) return null;
  const sec = Math.max(0, Math.round((at - t) / 1000));
  if (sec < 5) return '刚刚';
  if (sec < 60) return sec + ' 秒前';
  const min = Math.floor(sec / 60);
  if (min < 60) return min + ' 分钟前';
  const hour = Math.floor(min / 60);
  if (hour < 24) return hour + ' 小时前';
  return Math.floor(hour / 24) + ' 天前';
}

/**
 * 上游的 resetAt 是**秒**（后端 normalizeResetAt 归一化成秒），而页面其他
 * 时间戳（fetchedAt / pausedUntil）是**毫秒**。这里统一成毫秒再格式化：
 * 不去后端改是因为「秒」是写进契约的单位，页面自己适配更安全。
 * 小于 1e12 视为秒 —— 与后端 normalizeResetAt 同口径。
 */
function toMs(ts) {
  const n = Number(ts);
  if (!Number.isFinite(n) || n <= 0) return NaN;
  return n < 1e12 ? n * 1000 : n;
}

/** 距今还有多久（向前看）。用于「还有 5 天 22 小时重置」。 */
function untilText(ts, at = Date.now()) {
  const t = Number(ts);
  if (!Number.isFinite(t) || t <= 0) return null;
  let sec = Math.round((t - at) / 1000);
  if (sec <= 0) return '即将重置';
  if (sec < 60) return sec + ' 秒';
  const min = Math.floor(sec / 60);
  if (min < 60) return min + ' 分钟';
  const hour = Math.floor(min / 60);
  if (hour < 24) return hour + ' 小时 ' + (min % 60) + ' 分';
  const day = Math.floor(hour / 24);
  return day + ' 天 ' + (hour % 24) + ' 小时';
}

/** 「9/26 23:21」这种短日期，用于和倒计时并列显示。 */
function shortDate(ts) {
  const d = new Date(toMs(ts));
  if (Number.isNaN(d.getTime())) return '';
  const p = (n) => String(n).padStart(2, '0');
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/**
 * 窗口重置文案。
 * resetAt 是上游给的真实时间戳：5h/周来自 windowLimits，月来自 currentPeriodEnd。
 * 5h 窗口在「还没开始用」时上游返回 0 —— 那不代表马上重置，而是首次调用后才起算，
 * 所以这里要单独说清楚，不能显示成「即将重置」。
 */
function resetText(w, { zeroMeansIdle = false } = {}) {
  const ts = toMs(w && w.resetAt);
  if (!Number.isFinite(ts) || ts <= 0) {
    return zeroMeansIdle ? '空闲中 · 首次使用后 5 小时重置' : '';
  }
  const until = untilText(ts);
  if (!until) return '';
  const abs = shortDate(ts);
  return '重置于 ' + abs + '（还有 ' + until + '）';
}
/** 把毫秒写成「1 分钟」这种话。 */
function fmtEvery(ms) {
  const s = Math.round(Number(ms) / 1000);
  if (!Number.isFinite(s) || s <= 0) return '';
  if (s < 60) return s + ' 秒';
  const m = s / 60;
  if (m < 60) return (Number.isInteger(m) ? m : m.toFixed(1)) + ' 分钟';
  const h = m / 60;
  return (Number.isInteger(h) ? h : h.toFixed(1)) + ' 小时';
}

/**
 * 额度刷新频率文案。由后端 /api/status 的 quotaPoll 驱动，不在页面里写死 ——
 * 有请求时用活跃间隔（更快），闲着时用空闲间隔。
 */
function cadenceText(p) {
  const idle = Number(p && p.idleIntervalMs);
  const active = Number(p && p.activeIntervalMs);
  const idleTxt = idle > 0 ? fmtEvery(idle) : '';
  const activeTxt = active > 0 ? fmtEvery(active) : '';
  if (!idleTxt && !activeTxt) return '';
  if (activeTxt && idleTxt && activeTxt !== idleTxt) {
    return '额度自动刷新：有请求时每 ' + activeTxt + '、空闲时每 ' + idleTxt;
  }
  return '额度自动刷新：每 ' + (activeTxt || idleTxt);
}

/** 该账号额度快照的展示文案 + 是否过旧（> 2 倍空闲间隔）。 */
function freshness(ts) {
  const t = Number(ts);
  if (!Number.isFinite(t) || t <= 0) return { text: '额度尚未同步', stale: false };
  const age = Date.now() - t;
  if (age >= staleMs) return { text: '额度更新于 ' + timeText(t), stale: true, age };
  return { text: '额度更新于 ' + relText(t), stale: false, age };
}

/* KPI 语义色：错误>0 红、可用<总数 黄、在途>0 粉、0 值弱化 */
function paintKpi(boxId, numId, value, opts) {
  const box = $(boxId);
  const b = $(numId);
  const v = Number(value);
  const known = Number.isFinite(v);
  box.className = 'kpi';
  if (known) {
    if (opts.kind === 'danger' && v > 0) box.classList.add('is-danger');
    else if (opts.kind === 'warning' && opts.warnWhen && opts.warnWhen(v)) box.classList.add('is-warning');
    else if (opts.kind === 'accent' && v > 0) box.classList.add('is-accent');
    else if (v === 0) box.classList.add('is-muted');
  }
  b.textContent = known ? num(v) : '—';
}

/* 进度条只报百分比，金额挪进 title —— 用户要求：上面显示"用了百分之多少"就够了，
   不要把具体数额（9.94 / 10.03）摆在脸上。
   opts.spent=true：上游/探针已证明这个窗口「用完」时直接画满。百分比是推算值，
   99.4% 这种"差一点"会让人以为还能用（实测剩 $0.098 连一次请求都付不起），
   所以满不满由证据说了算，不由这个数字说了算。 */
function bar(label, w, opts) {
  const has = w && typeof w === 'object';
  const spent = !!opts && opts.spent === true;
  const pct = spent ? 100 : (has && typeof w.percent === 'number' ? w.percent : null);
  const amounts = has && typeof w.used === 'number' && typeof w.cap === 'number'
    ? money(w.used) + ' / ' + money(w.cap) : null;
  const reset = has ? resetText(w, { zeroMeansIdle: label.indexOf('5 小时') === 0 }) : '';
  return '<div class="bar-group"' + (amounts ? ' title="' + esc(label + '：已用 ' + amounts) + '"' : '') + '>'
    + '<div class="bar-head"><span class="bar-label">' + label + '</span>'
    + '<span class="bar-pct">' + pctText(pct) + '</span></div>'
    + '<div class="bar ' + cls(pct) + '"><i style="width:' + (pct === null ? 0 : Math.max(0, Math.min(100, pct))) + '%"></i></div>'
    + (reset ? '<div class="bar-reset">' + esc(reset) + '</div>' : '')
    + '</div>';
}

function statusText(a) {
  if (a.authInvalid) return { t: '鉴权失效', dot: 'invalid' };
  if (!a.enabled) return { t: '已停用', dot: 'paused' };
  if (a.paused) return { t: '暂停中', dot: 'paused' };
  // 额度耗尽统一口径：周/5 小时窗口用完、月额度用完，都说「已用完」而不是笼统的
  // 「不可调度」——用户要的正是这种可读性（副号1 = 周用完，主号 = 月用完）。
  if (a.exhausted && a.exhausted.label) return { t: a.exhausted.label, dot: 'invalid' };
  if (a.creditsExhausted) return { t: '余额不足', dot: 'invalid' };   // 兼容旧后端
  if (a.authInvalid) return { t: '鉴权失效', dot: 'invalid' };
  if (!a.available) return { t: '不可调度', dot: 'invalid' };
  return { t: '可用', dot: '' };
}

/** 额度新鲜度行：带 data-fetched-at，交给每秒的 tickFreshness() 重算。 */
function freshHTML(fetchedAt) {
  const t = Number(fetchedAt);
  const known = Number.isFinite(t) && t > 0;
  const f = freshness(known ? t : NaN);
  return '<div class="card-fresh' + (f.stale ? ' is-stale' : '') + '"'
    + (known ? ' data-fetched-at="' + t + '"' : '')
    + (f.stale ? ' title="额度快照已超过 10 分钟未更新"' : '')
    + '>' + esc(f.text) + '</div>';
}

function card(a) {
  const ex = a.exhausted || null;   // 统一口径的「额度已用完」（含恢复时间）
  const q = a.lastQuota;
  const c = q && q.credits ? q.credits : null;
  const st = statusText(a);
  const cardCls = st.dot;
  const tags = [];
  tags.push(a.enabled ? '<span class="tag ok">已启用</span>' : '<span class="tag warn">手动停用</span>');
  // 防御性：暂停/停用的账号绝不能同时标「可调度」。后端 isAvailable 已保证
  // （now 有默认值），但前端不该依赖单一数据源——历史 bug 就是这里露出矛盾的。
  const schedulable = a.available && a.enabled !== false && !a.paused && !a.authInvalid;
  tags.push(schedulable ? '<span class="tag ok">可调度</span>' : '<span class="tag bad">不可用</span>');
  if (a.paused) tags.push('<span class="tag warn">暂停至 ' + esc(timeText(a.pausedUntil)) + '</span>');
  if (a.authInvalid) tags.push('<span class="tag bad">鉴权失效</span>');
  // 余额不足和「额度打满」不一样：5h 窗口等了会自己回来，钱不会 —— 说清楚要充值
  if (a.exhausted && a.exhausted.label) {
    // 带上恢复时间（窗口/月度都有）——比「需充值」有用得多，也不逼人花钱
    const reset = Number(a.exhausted.resetAt) > 0
      ? ' · ' + shortDate(Number(a.exhausted.resetAt)) + ' 重置'
      : '';
    tags.push('<span class="tag bad">' + esc(a.exhausted.label + reset) + '</span>');
  } else if (a.creditsExhausted) {
    tags.push('<span class="tag bad">余额不足</span>');   // 兼容旧后端
  }
  tags.push('<span class="tag info">在途 ' + esc(num(a.concurrency)) + '</span>');
  if (q && q.plan) tags.push('<span class="tag">套餐 ' + esc(q.plan.planId ?? '-') + '</span>');

  const left = '<div class="card-col-left">'
    + '<div class="card-head"><h2>' + esc(a.name)
    + (q && q.displayName ? '<span class="card-display">' + esc(q.displayName) + '</span>' : '') + '</h2>'
    + '<span class="status"><span class="dot" aria-hidden="true"></span>' + st.t + '</span></div>'
    // 前台只显示备注名（h2 里）+ 上游显示名，不下发也不渲染 key 的任何片段
    + '<div class="card-money"><b>' + money(q ? q.remaining : null) + '</b><small>剩余额度</small></div>'
    + (c
      ? '<div class="card-credits">月度 ' + money(c.monthlyCredits) + ' · 购买 ' + money(c.purchasedCredits) + ' · 赠送 ' + money(c.freeCredits) + '</div>'
      : '<div class="card-credits">尚未获取额度快照</div>')
    + (q ? freshHTML(q.fetchedAt) : '')
    + '</div>';

  const right = '<div class="card-col-right">'
    + '<div class="bars">'
    + bar('5 小时窗口', q && q.fiveHour, { spent: ex && ex.kind === 'window' && ex.window === 'fiveHour' })
    + bar('本周窗口', q && q.weekly, { spent: ex && ex.kind === 'window' && ex.window === 'weekly' })
    + bar('本月周期', q && q.monthly, { spent: ex && ex.kind === 'monthly' })
    + '</div>'
    + (q && q.usage ? '<div class="card-usage">本周期 token ' + esc(num(q.usage.totalTokens))
      + (q.usage.totalCost === undefined ? '' : ' · 花费 ' + money(q.usage.totalCost)) + '</div>' : '')
    + '</div>';

  return '<article class="card ' + cardCls + '">'
    + '<div class="card-grid">' + left + right + '</div>'
    + '<div class="tags">' + tags.join('') + '</div>'
    + (a.lastError ? '<div class="err">最近错误：' + esc(a.lastError) + '</div>' : '')
    + '</article>';
}

function renderCards() {
  const all = state.data ? state.data.accounts : [];
  const f = state.filter.trim().toLowerCase();
  const list = f
    ? all.filter((a) => [a.name, a.lastQuota && a.lastQuota.displayName]
      .some((v) => String(v ?? '').toLowerCase().includes(f)))
    : all;
  if (!list.length) {
    $('cards').innerHTML = '<div class="card empty">' + (all.length
      ? '没有匹配「' + esc(state.filter) + '」的账号。'
      : '账号池为空。请在 accounts.json 里配置账号，或用 CC_ACCOUNTS 环境变量注入。') + '</div>';
    return;
  }
  $('cards').innerHTML = list.map(card).join('');
}

function render(d) {
  state.data = d;
  const s = d.summary || {};
  const st = d.stats || {};
  const accounts = d.accounts || [];
  setStaleFrom(d);   // 阈值跟随后端轮询配置（空闲间隔的 2 倍）

  $('health').textContent = '可用 ' + num(s.available) + ' / ' + num(s.accounts) + ' · 在途 ' + num(s.concurrency);
  $('health').className = 'pill ' + (Number(s.available) > 0 ? 'ok' : 'bad');
  $('updated').textContent = '更新于 ' + timeText(d.now);
  $('cadence').textContent = cadenceText(d.quotaPoll);
  $('upstream').textContent = '内核 ' + String(d.upstreamProxyUrl ?? '') + (d.allowPassthrough ? ' · 已开启直连透传' : '');
  $('tokens').textContent = num(st.totalTokens);

  // 余额：全页最大字号的主角
  const remaining = accounts.reduce((sum, a) => (a.lastQuota && Number.isFinite(a.lastQuota.remaining) ? sum + a.lastQuota.remaining : sum), 0);
  $('balance').textContent = accounts.length ? money(remaining) : '—';

  paintKpi('kpi-box-accounts', 'kpi-accounts', s.accounts, {});
  paintKpi('kpi-box-available', 'kpi-available', s.available, { kind: 'warning', warnWhen: (v) => Number(s.accounts) > v });
  paintKpi('kpi-box-paused', 'kpi-paused', s.paused, {});
  paintKpi('kpi-box-concurrency', 'kpi-concurrency', s.concurrency, { kind: 'accent' });
  paintKpi('kpi-box-total', 'kpi-total', st.total, {});
  paintKpi('kpi-box-errors', 'kpi-errors', st.errors, { kind: 'danger' });

  renderCards();
}

// ── 数据：公开只读，不鉴权（只有备注名 / 额度百分比，不含 key 的任何片段）──
/** 面板取数：同源公开接口，不需要任何凭证。 */
function apiFetch(path, opts = {}) {
  return fetch(path, Object.assign({ credentials: 'same-origin' }, opts));
}
function setHint(text, bad) {
  const el = $('keyhint');
  el.textContent = text || '';
  el.className = bad ? 'hint bad' : 'hint';
}
function clearKpis() {
  for (const id of ['kpi-accounts', 'kpi-available', 'kpi-paused', 'kpi-concurrency', 'kpi-total', 'kpi-errors']) {
    $(id).textContent = '—';
  }
  for (const id of ['kpi-box-accounts', 'kpi-box-available', 'kpi-box-paused', 'kpi-box-concurrency', 'kpi-box-total', 'kpi-box-errors']) {
    $(id).className = 'kpi';
  }
}
function showPrivate() {
  state.data = null;
  $('balance').textContent = '—';
  $('health').textContent = '需要登录后台';
  $('health').className = 'pill bad';
  $('tokens').textContent = '0';
  $('upstream').textContent = '';
  $('updated').textContent = '';
  $('cadence').textContent = '';
  clearKpis();
  $('cards').innerHTML = '<div class="card empty">当前实例已开启隐私模式（<span class="mono">PUBLIC_DASHBOARD=0</span>）：'
    + '请先<a href="/admin">登录后台</a>再查看面板数据。</div>';
}

async function load() {
  try {
    const r = await apiFetch('/api/status');
    if (r.status === 401) { showPrivate(); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    setHint('', false);
    render(await r.json());
  } catch (e) {
    $('health').textContent = '加载失败：' + e.message;
    $('health').className = 'pill bad';
  }
}

$('search').addEventListener('input', (e) => { state.filter = e.target.value || ''; renderCards(); });

// ── 主题：默认跟随系统，按钮手动切换 ────────────────────────────────
function storedTheme() {
  try { return localStorage.getItem(THEME_STORE) || ''; } catch { return ''; }
}
function prefersDark() { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
/** 当前生效主题：手动选择优先，否则跟随系统。 */
function currentTheme() { return document.documentElement.getAttribute('data-theme') || (prefersDark() ? 'dark' : 'light'); }
/** 手动切换：写 data-theme 并记住选择。 */
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem(THEME_STORE, t); } catch { /* 忽略 */ }
}
$('theme').onclick = () => setTheme(currentTheme() === 'dark' ? 'light' : 'dark');

// ── 问候语 + 实时时钟（时钟已降级为小字）────────────────────────────
function greetingOf(h) { return h < 5 ? '凌晨好' : h < 12 ? '早上好' : h < 18 ? '下午好' : '晚上好'; }
function tick() {
  const now = new Date();
  $('clock').textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
  $('date').textContent = now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
  $('greeting').textContent = greetingOf(now.getHours());
  tickFreshness();
}

/** 每秒本地重算所有卡片的相对时间（纯 DOM 更新，零请求）。 */
function tickFreshness() {
  const at = Date.now();
  for (const el of document.querySelectorAll('.card-fresh[data-fetched-at]')) {
    const t = Number(el.dataset.fetchedAt);
    const age = at - t;
    if (age >= staleMs) {
      el.textContent = '额度更新于 ' + timeText(t);
      el.classList.add('is-stale');
      el.title = '额度快照已超过 10 分钟未更新';
    } else {
      el.textContent = '额度更新于 ' + relText(t, at);
      el.classList.remove('is-stale');
      el.removeAttribute('title');
    }
  }
}

// ── 樱花花瓣：约束在视口内，容器 overflow:hidden，尺寸小、透明度低 ──
function petals() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const host = $('petals');
  const vw = Math.max(320, window.innerWidth);
  const tints = ['var(--accent)', '#f7b6c9', 'var(--accent-hover)'];
  const count = 10;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('span');
    const size = 4 + Math.random() * 3;                       // 4–7px
    // 约束花瓣在 [0, 100vw] 内：留出 ±5vw 飘移余量，永不贴边被裁
    const lane = ((i + 0.5) / count) * 100;
    const jitter = (Math.random() - 0.5) * (50 / count);
    const left = Math.min(92, Math.max(8, lane + jitter));
    p.className = 'petal';
    p.style.left = left + '%';
    p.style.width = size.toFixed(1) + 'px';
    p.style.height = size.toFixed(1) + 'px';
    p.style.background = tints[i % tints.length];
    p.style.opacity = (0.15 + Math.random() * 0.1).toFixed(2);  // 0.15–0.25
    p.style.animationDuration = (14 + Math.random() * 10).toFixed(1) + 's';
    p.style.animationDelay = (-Math.random() * 24).toFixed(1) + 's';
    host.appendChild(p);
  }
}

const savedTheme = storedTheme();
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
petals();
tick();
setInterval(tick, 1000);

load();
setInterval(() => { if (!document.hidden) load(); }, 5000);
</script>
