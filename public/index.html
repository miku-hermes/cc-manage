<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>cc-manage · 额度面板</title>
<style>
  /* 原生控件配色（滚动条 / 表单 / 日期选择器）：基础 + 手动主题分派。
     B2-13 契约要求这块留在 HTML 内联 <style> 里；拆分后仍原样保留。 */
  :root { color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
</style>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>

<header class="header">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.5 6.2 6.2 2.5-6.2 2.5-2.5 6.2-2.5-6.2L3.3 11.3l6.2-2.5z"/></svg>
    </span>
    <span class="brand-name">cc-manage</span>
  </div>

  <div class="tools">
    <label class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.4-3.4"/>
      </svg>
      <input id="search" type="search" placeholder="搜索账号" aria-label="搜索账号" autocomplete="off">
    </label>
    <button id="theme" class="icon-btn" type="button" title="切换主题" aria-label="切换主题">
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
    </button>
    <a class="admin-link" href="/admin" aria-label="登录后台" title="账号密码登录后台，管理 CC key 与客户端 key">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.2"/><path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/></svg>
      <span class="admin-link-label">登录后台</span>
    </a>
    <span id="keyhint" class="hint"></span>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-main">
      <h1 id="greeting" class="greeting">下午好</h1>
      <div class="hero-balance">
        <b id="balance">—</b>
        <span id="bal-label" class="bal-label">剩余额度（USD）</span>
      </div>
      <p class="hero-sub">网关状态 <span id="health" class="pill">加载中…</span></p>
      <p class="hero-meta aux-text"><span id="upstream"></span><span id="updated"></span><span id="cadence" class="hero-cadence"></span></p>
    </div>
    <div class="hero-aside">
      <div class="hero-clock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
        <span id="clock">--:--:--</span>
      </div>
      <div id="date" class="hero-date"></div>
      <div class="hero-tokens">累计 token <b id="tokens">0</b></div>
    </div>
  </section>

  <section class="kpis">
    <div class="kpi" id="kpi-box-accounts">
      <span class="kpi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg></span>
      <div class="kpi-body"><b id="kpi-accounts">—</b><span>账号数</span></div>
    </div>
    <div class="kpi" id="kpi-box-available">
      <span class="kpi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.4l2.6 2.6 5-5.6"/></svg></span>
      <div class="kpi-body"><b id="kpi-available">—</b><span>可用</span></div>
    </div>
    <div class="kpi" id="kpi-box-paused">
      <span class="kpi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="7.2" y="5" width="3.6" height="14" rx="1.3"/><rect x="13.2" y="5" width="3.6" height="14" rx="1.3"/></svg></span>
      <div class="kpi-body"><b id="kpi-paused">—</b><span>暂停中</span></div>
    </div>
    <div class="kpi" id="kpi-box-unavailable">
      <span class="kpi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg></span>
      <div class="kpi-body"><b id="kpi-unavailable">—</b><span>不可用</span></div>
    </div>
    <div class="kpi" id="kpi-box-total">
      <span class="kpi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span>
      <div class="kpi-body"><b id="kpi-total">—</b><span>总请求</span></div>
    </div>
    <div class="kpi" id="kpi-box-errors">
      <span class="kpi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg></span>
      <!-- 口径：errors 只统计上游/网关故障（5xx/中断/鉴权），客户端 4xx（模型名错等）单独计
           clientErrors，不再把「客户端用错模型」算成网关变红。 -->
      <div class="kpi-body"><b id="kpi-errors">—</b><span>上游错误数</span></div>
    </div>
  </section>

  <section class="grid" id="cards"></section>
</main>


<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/render-hero.js"></script>
<script src="js/render-cards.js"></script>
<script src="js/app.js"></script>
<script>
/* 引导块：外部脚本已按依赖顺序加载（utils → api → state → render-* → app）。
   这里保留标签条渐隐状态类的维护（B2-17 契约要求这段留在 HTML 内联脚本里），
   并把测试 vm 需要的全局暴露出去；启动逻辑在 js/app.js 的 boot()。 */
function syncTagMasks() {
  for (const el of document.querySelectorAll('#cards .tags')) {
    const max = Math.max(0, (el.scrollWidth || 0) - (el.clientWidth || 0));
    const scrollable = max > 1;
    el.classList.toggle('is-scrollable', scrollable);
    el.classList.toggle('at-end', scrollable && (el.scrollLeft || 0) >= max - 1);
  }
}
$('cards').addEventListener('scroll', syncTagMasks, true);
window.state = state;
window.renderCards = renderCards;
window.syncTagMasks = syncTagMasks;
boot();
</script>
</body>
</html>
