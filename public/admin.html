<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-manage · 后台</title>
<style>
  :root {
    --bg-primary: #f8f6f9;
    --bg-secondary: #ffffff;
    --bg-tertiary: #f0edf3;
    --bg-card: #ffffff;
    --bg-card-hover: #faf8fc;
    --text-primary: #2d1b3d;
    --text-secondary: #6b5a7d;
    --text-tertiary: #9b8aad;
    --border-color: #e8e0f0;
    --border-light: #f0eaf5;
    --accent: #e8668a;
    --accent-hover: #d44a72;
    --accent-light: #fce4ec;
    --success: #4caf7d;
    --warning: #f5a623;
    --danger: #e74c5e;
    --info: #5c9ced;
    --shadow-soft: 0 1px 2px rgba(45, 27, 61, .05);
    --shadow-lift: 0 8px 22px rgba(232, 102, 138, .12);
    --radius-card: 14px;
    --radius-sm: 12px;
    --pill: 999px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-primary: #1a1119;
      --bg-secondary: #221826;
      --bg-tertiary: #2a1f2e;
      --bg-card: #2a1f2e;
      --bg-card-hover: #332538;
      --text-primary: #e8e2ec;
      --text-secondary: #b8adc2;
      --text-tertiary: #8a8290;
      --border-color: #3a2d40;
      --border-light: #2f2434;
      --accent: #f2a0b5;
      --accent-hover: #e8668a;
      --accent-light: #3d2430;
      --success: #6ddba0;
      --warning: #ffc266;
      --danger: #ff8095;
      --info: #7fb3f5;
      --shadow-soft: 0 1px 2px rgba(0, 0, 0, .25);
      --shadow-lift: 0 8px 22px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg-primary: #1a1119;
    --bg-secondary: #221826;
    --bg-tertiary: #2a1f2e;
    --bg-card: #2a1f2e;
    --bg-card-hover: #332538;
    --text-primary: #e8e2ec;
    --text-secondary: #b8adc2;
    --text-tertiary: #8a8290;
    --border-color: #3a2d40;
    --border-light: #2f2434;
    --accent: #f2a0b5;
    --accent-hover: #e8668a;
    --accent-light: #3d2430;
    --success: #6ddba0;
    --warning: #ffc266;
    --danger: #ff8095;
    --info: #7fb3f5;
    --shadow-soft: 0 1px 2px rgba(0, 0, 0, .25);
    --shadow-lift: 0 8px 22px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-primary);
    color: var(--text-primary);
    font: 14px/1.6 ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .2s, color .2s;
  }
  .mono { font-family: ui-monospace, Menlo, Consolas, "Cascadia Mono", monospace; }

  /* ── 顶部导航栏（同前台，无花瓣）────────────────────── */
  .header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 14px 24px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 30px; height: 30px; border-radius: var(--pill); display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: #fff; flex: none;
  }
  .logo svg { width: 17px; height: 17px; }
  .brand-name { font-size: 17px; font-weight: 700; letter-spacing: .4px; }
  .brand-sub {
    font-size: 11px; color: var(--accent); border: 1px solid var(--accent);
    border-radius: var(--pill); padding: 1px 9px;
  }
  .nav-link {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    color: var(--text-secondary); font-size: 13px; padding: 7px 14px;
    border-radius: var(--pill); border: 1px solid var(--border-color); background: var(--bg-card);
    transition: color .15s, border-color .15s;
  }
  .nav-link:hover { color: var(--accent); border-color: var(--accent); }

  .tools {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px; border: 1px solid var(--border-color); border-radius: var(--pill);
    background: var(--bg-tertiary); box-shadow: var(--shadow-soft);
  }
  button { font: inherit; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 7px 14px; border-radius: var(--pill);
    border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-secondary);
    font-size: 13px; transition: color .15s, border-color .15s, background .15s;
  }
  .btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn svg { width: 15px; height: 15px; }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    border-color: transparent; color: #fff;
  }
  .btn.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.06); }
  .btn.danger:hover:not(:disabled) { color: var(--danger); border-color: var(--danger); }
  .icon-btn {
    display: grid; place-items: center; cursor: pointer; width: 34px; height: 34px;
    border-radius: var(--pill); border: 1px solid var(--border-color);
    background: var(--bg-card); color: var(--text-secondary);
    transition: color .15s, border-color .15s;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn svg { width: 17px; height: 17px; }
  .ico-sun { display: none; }
  :root[data-theme="dark"] .ico-sun { display: block; }
  :root[data-theme="dark"] .ico-moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .ico-sun { display: block; }
    :root:not([data-theme="light"]) .ico-moon { display: none; }
  }

  .keybar { display: flex; align-items: center; gap: 8px; }
  #key {
    width: 200px; padding: 7px 14px; border-radius: var(--pill);
    border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary);
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
  }
  #key:focus { outline: none; border-color: var(--accent); }
  #key.bad { border-color: var(--danger); }
  .hint { font-size: 12px; color: var(--warning); }

  /* ── 主区域 ───────────────────────────────────────────── */
  main { max-width: 1400px; margin: 0 auto; padding: 22px 24px 8px; }

  .banner {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 16px; padding: 12px 16px; border-radius: var(--radius-sm);
    border: 1px solid var(--danger); color: var(--danger); background: var(--bg-card); font-size: 13px;
  }
  .banner.warn { border-color: var(--warning); color: var(--warning); }
  .banner.hidden, .hidden { display: none; }

  section.panel {
    margin-bottom: 18px; border-radius: var(--radius-card);
    background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: var(--shadow-soft);
    overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 15px 18px; border-bottom: 1px solid var(--border-light);
    background-image: radial-gradient(520px 150px at 100% 0%, var(--accent-light), transparent 72%);
  }
  .panel-head h2 { margin: 0; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .panel-head h2 svg { width: 17px; height: 17px; color: var(--accent); }
  .panel-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .panel-body { padding: 6px 0 0; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 11px 18px; text-align: left; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
  th {
    font-size: 12px; font-weight: 600; color: var(--text-tertiary);
    background: var(--bg-tertiary); white-space: nowrap;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--bg-card-hover); }
  td.actions { white-space: nowrap; text-align: right; }
  td.actions .btn { padding: 5px 11px; font-size: 12px; margin-left: 6px; }
  .cell-name { font-weight: 600; }
  .cell-sub { font-size: 11px; color: var(--text-tertiary); word-break: break-all; }

  select, input[type="text"], textarea {
    font: inherit; color: var(--text-primary); background: var(--bg-card);
    border: 1px solid var(--border-color); border-radius: var(--radius-sm);
    padding: 7px 12px; width: 100%;
  }
  select:focus, input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 84px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
  .filter-select { width: auto; border-radius: var(--pill); font-size: 12px; padding: 6px 12px; }

  .tag {
    display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: var(--pill);
    background: var(--bg-tertiary); border: 1px solid var(--border-light); color: var(--text-secondary);
    white-space: nowrap;
  }
  .tag.ok { color: var(--success); border-color: var(--success); }
  .tag.bad { color: var(--danger); border-color: var(--danger); }
  .tag.warn { color: var(--warning); border-color: var(--warning); }
  .tag.info { color: var(--info); border-color: var(--info); }

  .empty { color: var(--text-secondary); text-align: center; padding: 30px 18px; }

  /* ── 事件列表 ─────────────────────────────────────────── */
  .events { max-height: 420px; overflow-y: auto; font-size: 12.5px; }
  .event {
    display: flex; align-items: baseline; gap: 10px;
    padding: 9px 18px; border-bottom: 1px solid var(--border-light);
  }
  .event:last-child { border-bottom: none; }
  .event-time { color: var(--text-tertiary); font-variant-numeric: tabular-nums; flex: none; }
  .event-level { flex: none; width: 52px; }
  .event-msg { color: var(--text-secondary); word-break: break-all; }

  /* ── 弹窗 ─────────────────────────────────────────────── */
  .modal {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(26, 17, 25, .45); backdrop-filter: blur(2px);
  }
  .modal.open { display: flex; }
  .dialog {
    width: min(460px, 100%); border-radius: var(--radius-card);
    background: var(--bg-secondary); border: 1px solid var(--border-color);
    box-shadow: var(--shadow-lift); padding: 22px;
  }
  .dialog h3 { margin: 0 0 4px; font-size: 16px; }
  .dialog p.sub { margin: 0 0 16px; font-size: 12px; color: var(--text-tertiary); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .err-text { color: var(--danger); font-size: 12px; min-height: 18px; word-break: break-all; }

  .onetime {
    margin: 14px 0; padding: 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--accent); background: var(--accent-light);
  }
  .onetime-label { font-size: 12px; color: var(--accent-hover); font-weight: 600; margin-bottom: 8px; }
  :root[data-theme="dark"] .onetime-label { color: var(--accent); }
  .onetime-value {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-radius: var(--radius-sm);
    background: var(--bg-card); border: 1px solid var(--border-color);
    font-size: 12.5px; word-break: break-all;
  }
  .onetime-value code { flex: 1; user-select: all; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 18px);
    padding: 10px 20px; border-radius: var(--pill); font-size: 13px;
    background: var(--bg-secondary); border: 1px solid var(--accent); color: var(--text-primary);
    box-shadow: var(--shadow-lift); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    z-index: 60; max-width: min(560px, 90vw);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { border-color: var(--danger); color: var(--danger); }

  footer { text-align: center; padding: 22px 16px 40px; font-size: 12px; color: var(--text-tertiary); }

  @media (max-width: 820px) {
    .header { padding: 12px 16px; }
    .tools { width: 100%; border-radius: var(--radius-sm); }
    #key { width: 100%; }
    .keybar { flex: 1 1 100%; }
    main { padding: 18px 16px 4px; }
    th, td { padding: 10px 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.5 6.2 6.2 2.5-6.2 2.5-2.5 6.2-2.5-6.2L3.3 11.3l6.2-2.5z"/></svg>
    </span>
    <span class="brand-name">cc-manage</span>
    <span class="brand-sub">后台</span>
  </div>

  <div class="tools">
    <a class="nav-link" href="/">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      返回前台
    </a>
    <button id="theme" class="icon-btn" type="button" title="切换主题" aria-label="切换主题">
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
    </button>
    <div class="keybar">
      <input id="key" type="password" placeholder="本地 key（sk-cg-…）" autocomplete="off" spellcheck="false" aria-label="本地 key">
      <button id="savekey" class="btn" type="button">保存</button>
    </div>
    <span id="keyhint" class="hint"></span>
  </div>
</header>

<main>
  <div id="readonly" class="banner hidden"></div>
  <div id="autherr" class="banner hidden"></div>

  <!-- 账号管理 -->
  <section class="panel">
    <div class="panel-head">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        账号管理
        <span id="acc-count" class="tag info">—</span>
      </h2>
      <div class="panel-tools">
        <button id="add-account" class="btn primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          新增账号
        </button>
      </div>
    </div>
    <div class="panel-body"><div class="table-wrap"><table>
      <thead>
        <tr><th>账号名</th><th>keyId</th><th>keyPrefix</th><th>状态</th><th style="text-align:right">操作</th></tr>
      </thead>
      <tbody id="accounts"></tbody>
    </table></div></div>
  </section>

  <!-- 客户端 key 管理 -->
  <section class="panel">
    <div class="panel-head">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7a4 4 0 1 0-3.4 3.95L10 12H8v2H6v2H3v-3l6.05-6.05A4 4 0 0 1 15 7z"/><circle cx="16.5" cy="10.5" r=".8" fill="currentColor"/></svg>
        客户端 key 管理
        <span id="key-count" class="tag info">—</span>
      </h2>
      <div class="panel-tools">
        <button id="add-key" class="btn primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          生成新 key
        </button>
      </div>
    </div>
    <div class="panel-body"><div class="table-wrap"><table>
      <thead>
        <tr><th>名称</th><th>keyId</th><th>keyPrefix</th><th>创建时间</th><th style="text-align:right">操作</th></tr>
      </thead>
      <tbody id="keys"></tbody>
    </table></div></div>
  </section>

  <!-- 运行日志 -->
  <section class="panel">
    <div class="panel-head">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>
        运行日志
        <span id="event-count" class="tag info">—</span>
      </h2>
      <div class="panel-tools">
        <select id="level" class="filter-select" aria-label="按级别过滤">
          <option value="">全部级别</option>
          <option value="info">info</option>
          <option value="warn">warn</option>
          <option value="error">error</option>
          <option value="debug">debug</option>
        </select>
        <button id="reload-events" class="btn" type="button">刷新</button>
      </div>
    </div>
    <div class="panel-body"><div id="events" class="events"></div></div>
  </section>
</main>

<footer>后台管理 · 所有响应只暴露 keyId / keyPrefix，绝不回显完整 key · cc-manage</footer>

<!-- 新增账号 -->
<div class="modal" id="m-account">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="m-account-title">
    <h3 id="m-account-title">新增账号</h3>
    <p class="sub">CC 上游 key 只用于服务端转发，不会在页面回显。</p>
    <div class="field">
      <label for="a-name">账号名</label>
      <input id="a-name" type="text" placeholder="例如：主号" maxlength="64" autocomplete="off">
    </div>
    <div class="field">
      <label for="a-key">账号 key（以 user_ 开头）</label>
      <textarea id="a-key" placeholder="user_xxxxxxxx…" spellcheck="false" autocomplete="off"></textarea>
    </div>
    <div class="err-text" id="a-err"></div>
    <div class="dialog-actions">
      <button class="btn" type="button" data-close="m-account">取消</button>
      <button class="btn primary" type="button" id="a-submit">创建</button>
    </div>
  </div>
</div>

<!-- 改备注 -->
<div class="modal" id="m-rename">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="m-rename-title">
    <h3 id="m-rename-title">修改备注</h3>
    <p class="sub" id="r-sub"></p>
    <div class="field">
      <label for="r-name">新名称</label>
      <input id="r-name" type="text" maxlength="64" autocomplete="off">
    </div>
    <div class="err-text" id="r-err"></div>
    <div class="dialog-actions">
      <button class="btn" type="button" data-close="m-rename">取消</button>
      <button class="btn primary" type="button" id="r-submit">保存</button>
    </div>
  </div>
</div>

<!-- 生成客户端 key -->
<div class="modal" id="m-newkey">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="m-newkey-title">
    <h3 id="m-newkey-title">生成新 key</h3>
    <p class="sub">key 由服务端生成（sk-cg- + 32 字节随机），只显示一次。</p>
    <div id="k-form">
      <div class="field">
        <label for="k-name">客户端名称</label>
        <input id="k-name" type="text" placeholder="例如：我的笔记本" maxlength="64" autocomplete="off">
      </div>
      <div class="err-text" id="k-err"></div>
    </div>
    <div id="k-result" class="hidden">
      <div class="onetime">
        <div class="onetime-label">⚠ 此 key 只显示一次，请立刻复制保存</div>
        <div class="onetime-value">
          <code id="k-plain" class="mono"></code>
          <button class="btn" type="button" id="k-copy">复制</button>
        </div>
      </div>
      <div class="err-text" id="k-warn"></div>
    </div>
    <div class="dialog-actions">
      <button class="btn" type="button" data-close="m-newkey">关闭</button>
      <button class="btn primary" type="button" id="k-submit">生成</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (id) => document.getElementById(id);
const KEY_STORE = 'cc-manage-key';
const THEME_STORE = 'cc-manage-theme';
const state = { writable: true, accounts: [], keys: [], events: [], level: '', readonlyReason: '' };
let renameTarget = null;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function timeText(ts) { const d = new Date(ts); return Number.isNaN(d.getTime()) ? '—' : d.toLocaleString('zh-CN', { hour12: false }); }
function shortId(id) { return String(id ?? '').slice(0, 8); }

function toast(text, bad) {
  const el = $('toast');
  el.textContent = text;
  el.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = 'toast' + (bad ? ' bad' : ''); }, 2600);
}

// ── 本地 key：sessionStorage + Authorization: Bearer ─────────────────
function getKey() {
  try { return sessionStorage.getItem(KEY_STORE) || ''; } catch { return ''; }
}
function setKey(v) {
  try { v ? sessionStorage.setItem(KEY_STORE, v) : sessionStorage.removeItem(KEY_STORE); } catch { /* 忽略 */ }
}
function authHeaders(extra) {
  const k = getKey();
  return k ? Object.assign({ Authorization: 'Bearer ' + k }, extra) : Object.assign({}, extra);
}
function apiFetch(path, opts = {}) {
  if (!getKey()) return Promise.reject(new Error('NO_KEY'));
  return fetch(path, Object.assign({}, opts, { headers: authHeaders(opts.headers) }));
}
function apiJSON(path, { method = 'GET', body } = {}) {
  const opts = { method, headers: { 'content-type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  return apiFetch(path, opts).then(async (r) => {
    let data = null;
    try { data = await r.json(); } catch { /* 非 JSON 响应 */ }
    if (!r.ok) {
      const err = new Error((data && data.error && data.error.message) || ('HTTP ' + r.status));
      err.status = r.status;
      throw err;
    }
    return data;
  });
}
function setHint(text, bad) {
  $('keyhint').textContent = text || '';
  $('key').className = bad ? 'bad' : '';
}
function fatal(message) {
  $('autherr').textContent = message;
  $('autherr').className = 'banner';
}

// ── 只读模式：把所有写按钮置灰并说明原因 ──────────────────────────────
function applyWritable(writable, reason) {
  state.writable = writable !== false;
  const locked = !state.writable;
  for (const id of ['add-account', 'add-key', 'k-submit', 'a-submit', 'r-submit']) {
    const el = $(id);
    if (el) { el.disabled = locked; el.title = locked ? (reason || '当前为只读模式') : ''; }
  }
  for (const btn of document.querySelectorAll('#accounts .actions button, #keys .actions button')) {
    btn.disabled = locked;
  }
  $('readonly').textContent = locked ? (reason || '凭据以只读方式挂载，无法修改；请改用 config/ 目录挂载') : '';
  $('readonly').className = locked ? 'banner warn' : 'banner hidden';
}

function statusTag(a) {
  if (a.authInvalid) return '<span class="tag bad">鉴权失效</span>';
  if (!a.enabled) return '<span class="tag warn">已停用</span>';
  if (a.paused) return '<span class="tag warn">暂停中</span>';
  return '<span class="tag ok">可用</span>';
}

function renderAccounts() {
  const list = state.accounts;
  $('acc-count').textContent = list.length + ' 个';
  if (!list.length) {
    $('accounts').innerHTML = '<tr><td colspan="5" class="empty">还没有账号，点右上角「新增账号」添加</td></tr>';
    applyWritable(state.writable, state.readonlyReason);
    return;
  }
  $('accounts').innerHTML = list.map((a) => {
    const id = esc(a.keyId);
    return '<tr>'
      + '<td><div class="cell-name">' + esc(a.name) + '</div></td>'
      + '<td class="mono cell-sub">' + id + '</td>'
      + '<td class="mono cell-sub">' + esc(a.keyPrefix) + '…</td>'
      + '<td>' + statusTag(a) + '</td>'
      + '<td class="actions">'
      + '<button class="btn" type="button" data-act="toggle" data-id="' + id + '">' + (a.enabled ? '停用' : '启用') + '</button>'
      + '<button class="btn" type="button" data-act="rename" data-id="' + id + '">改备注</button>'
      + '<button class="btn danger" type="button" data-act="del" data-id="' + id + '">删除</button>'
      + '</td></tr>';
  }).join('');
  applyWritable(state.writable, state.readonlyReason);
}

function renderKeys() {
  const list = state.keys;
  $('key-count').textContent = list.length + ' 个';
  if (!list.length) {
    $('keys').innerHTML = '<tr><td colspan="5" class="empty">还没有客户端 key，点「生成新 key」创建</td></tr>';
    applyWritable(state.writable, state.readonlyReason);
    return;
  }
  $('keys').innerHTML = list.map((k) => {
    const id = esc(k.keyId);
    return '<tr>'
      + '<td><div class="cell-name">' + esc(k.name) + '</div></td>'
      + '<td class="mono cell-sub">' + id + '</td>'
      + '<td class="mono cell-sub">' + esc(k.keyPrefix) + '…</td>'
      + '<td class="cell-sub">' + esc(k.createdAt ? timeText(k.createdAt) : '—') + '</td>'
      + '<td class="actions"><button class="btn danger" type="button" data-act="delkey" data-id="' + id + '">删除</button></td>'
      + '</tr>';
  }).join('');
  applyWritable(state.writable, state.readonlyReason);
}

function renderEvents() {
  const list = state.events;
  $('event-count').textContent = list.length + ' 条';
  if (!list.length) {
    $('events').innerHTML = '<div class="empty">暂无事件</div>';
    return;
  }
  $('events').innerHTML = list.map((e) => {
    const lvl = String(e.level || 'info');
    const cls = lvl === 'error' ? 'bad' : lvl === 'warn' ? 'warn' : lvl === 'debug' ? '' : 'ok';
    return '<div class="event">'
      + '<span class="event-time">' + esc(timeText(e.at)) + '</span>'
      + '<span class="event-level"><span class="tag ' + cls + '">' + esc(lvl) + '</span></span>'
      + '<span class="event-msg">' + esc(e.message) + '</span>'
      + '</div>';
  }).join('');
}

// ── 加载 ────────────────────────────────────────────────────────────
async function loadAccounts() {
  const data = await apiJSON('/api/admin/accounts');
  state.accounts = data.accounts || [];
  state.readonlyReason = '凭据以只读方式挂载，无法修改；请改用 config/ 目录挂载';
  renderAccounts();
  applyWritable(data.writable !== false, state.readonlyReason);
}

async function loadKeys() {
  const data = await apiJSON('/api/admin/keys');
  state.keys = data.keys || [];
  renderKeys();
}

async function loadEvents() {
  const q = state.level ? '?level=' + encodeURIComponent(state.level) : '';
  const data = await apiJSON('/api/admin/events' + q);
  state.events = data.events || [];
  renderEvents();
}

async function loadAll() {
  if (!getKey()) {
    $('autherr').textContent = '请先在右上角填入本地 key（sk-cg-…）并保存，后台需要鉴权。';
    $('autherr').className = 'banner';
    return;
  }
  try {
    await loadAccounts();
    $('autherr').className = 'banner hidden';
    setHint('', false);
  } catch (e) {
    if (e.status === 401) { setHint('key 无效或缺失（401）', true); fatal('本地 key 无效或缺失（401）：请在右上角重新填入 keys.json 里的 key。'); return; }
    if (e.message === 'NO_KEY') return;
    fatal('加载失败：' + e.message);
    return;
  }
  await Promise.all([loadKeys().catch((e) => { if (e.status === 401) return; toast('客户端 key 加载失败：' + e.message, true); }),
                     loadEvents().catch((e) => { if (e.status === 401) return; toast('事件加载失败：' + e.message, true); })]);
}

// ── 账号操作 ────────────────────────────────────────────────────────
function openModal(id) { $(id).classList.add('open'); }
function closeModal(id) { $(id).classList.remove('open'); }
for (const el of document.querySelectorAll('[data-close]')) {
  el.onclick = () => closeModal(el.getAttribute('data-close'));
}
for (const el of document.querySelectorAll('.modal')) {
  el.addEventListener('mousedown', (e) => { if (e.target === el) el.classList.remove('open'); });
}

async function guard(fn) {
  try { await fn(); }
  catch (e) {
    if (e.status === 401) { setHint('key 无效或缺失（401）', true); fatal('本地 key 无效或缺失（401）。'); return; }
    if (e.status === 403) { applyWritable(false, e.message); toast(e.message, true); return; }
    toast(e.message || '操作失败', true);
  }
}

$('add-account').onclick = () => { $('a-err').textContent = ''; openModal('m-account'); $('a-name').focus(); };
$('a-submit').onclick = () => guard(async () => {
  $('a-err').textContent = '';
  const name = $('a-name').value.trim();
  const key = $('a-key').value.trim();
  try {
    await apiJSON('/api/admin/accounts', { method: 'POST', body: { name, key } });
  } catch (e) { $('a-err').textContent = e.message; return; }
  $('a-name').value = '';
  $('a-key').value = '';          // 提交后清空
  closeModal('m-account');
  toast('账号已新增并热生效');
  await loadAccounts();
});

$('accounts').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = btn.getAttribute('data-id');
  const account = state.accounts.find((a) => shortId(a.keyId) === shortId(id));
  if (!account) return;

  if (btn.getAttribute('data-act') === 'toggle') {
    return guard(async () => {
      await apiJSON('/api/admin/accounts/' + encodeURIComponent(id), { method: 'PATCH', body: { enabled: !account.enabled } });
      toast(account.enabled ? '账号已停用' : '账号已启用');
      await loadAccounts();
    });
  }

  if (btn.getAttribute('data-act') === 'rename') {
    renameTarget = id;
    $('r-sub').textContent = '账号「' + account.name + '」（keyId ' + shortId(id) + '）';
    $('r-name').value = account.name;
    $('r-err').textContent = '';
    openModal('m-rename');
    $('r-name').focus();
    return;
  }

  if (btn.getAttribute('data-act') === 'del') {
    if (!confirm('确定要删除账号「' + account.name + '」吗？\nkeyId ' + shortId(id) + '，该操作不可撤销。')) return;
    return guard(async () => {
      await apiJSON('/api/admin/accounts/' + encodeURIComponent(id), { method: 'DELETE' });
      toast('账号已删除');
      await loadAccounts();
    });
  }
});

$('r-submit').onclick = () => guard(async () => {
  $('r-err').textContent = '';
  const name = $('r-name').value.trim();
  try {
    await apiJSON('/api/admin/accounts/' + encodeURIComponent(renameTarget), { method: 'PATCH', body: { name } });
  } catch (e) { $('r-err').textContent = e.message; return; }
  closeModal('m-rename');
  toast('备注已更新');
  await loadAccounts();
});

// ── 客户端 key 操作 ─────────────────────────────────────────────────
function resetNewKeyModal() {
  $('k-form').classList.remove('hidden');
  $('k-result').classList.add('hidden');
  $('k-err').textContent = '';
  $('k-warn').textContent = '';
  $('k-name').value = '';
  $('k-plain').textContent = '';
  $('k-submit').disabled = !state.writable;
  $('k-submit').classList.remove('hidden');
}
$('add-key').onclick = () => { resetNewKeyModal(); openModal('m-newkey'); $('k-name').focus(); };

$('k-submit').onclick = () => guard(async () => {
  $('k-err').textContent = '';
  const name = $('k-name').value.trim();
  let data;
  try {
    data = await apiJSON('/api/admin/keys', { method: 'POST', body: { name } });
  } catch (e) { $('k-err').textContent = e.message; return; }
  $('k-form').classList.add('hidden');
  $('k-result').classList.remove('hidden');
  $('k-submit').classList.add('hidden');
  $('k-plain').textContent = data.plaintext;
  $('k-warn').textContent = (data.warning || '此 key 只显示一次') + '，关闭后无法再次查看。';
  await loadKeys();
});

$('k-copy').onclick = async () => {
  const text = $('k-plain').textContent;
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制到剪贴板');
  } catch {
    const range = document.createRange();
    range.selectNodeContents($('k-plain'));
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    toast('已选中，请按 Ctrl/Cmd+C 复制');
  }
};

$('keys').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act="delkey"]');
  if (!btn) return;
  const id = btn.getAttribute('data-id');
  const k = state.keys.find((x) => shortId(x.keyId) === shortId(id));
  if (!k) return;
  if (!confirm('确定要删除客户端 key「' + k.name + '」吗？\n删除后该客户端会立刻 401。')) return;
  return guard(async () => {
    await apiJSON('/api/admin/keys/' + encodeURIComponent(id), { method: 'DELETE' });
    toast('客户端 key 已删除');
    await loadKeys();
  });
});

// ── 事件过滤 ────────────────────────────────────────────────────────
$('level').onchange = (e) => { state.level = e.target.value; loadEvents().catch((err) => toast(err.message, true)); };
$('reload-events').onclick = () => loadEvents().catch((err) => toast(err.message, true));

// ── 主题 ────────────────────────────────────────────────────────────
function storedTheme() {
  try { return localStorage.getItem(THEME_STORE) || ''; } catch { return ''; }
}
function prefersDark() { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
function currentTheme() { return document.documentElement.getAttribute('data-theme') || (prefersDark() ? 'dark' : 'light'); }
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem(THEME_STORE, t); } catch { /* 忽略 */ }
}
$('theme').onclick = () => setTheme(currentTheme() === 'dark' ? 'light' : 'dark');

// ── 启动 ────────────────────────────────────────────────────────────
const savedTheme = storedTheme();
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
$('key').value = getKey();
$('savekey').onclick = () => { setKey($('key').value.trim()); setHint('', false); loadAll(); };
$('key').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('savekey').click(); });
loadAll();
setInterval(() => { if (getKey() && !document.hidden) loadEvents().catch(() => {}); }, 10000);
</script>
</body>
